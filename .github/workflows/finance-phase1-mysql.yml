name: ARNA Finance Phase 1 MySQL integrity

on:
  push:
    branches:
      - feat/finance-gl-integrity-phase1
    paths:
      - ".github/workflows/finance-phase1-mysql.yml"
      - "mases_core/src/Domains/Finance/**"
      - "bootstrap/providers.php"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character commit SHA to verify (defaults to the selected ref)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: arna-finance-phase1-mysql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finance-integrity:
    name: Finance migration and GL integrity regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arna_finance_phase1_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: arna_finance_phase1_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Resolve exact target commit
        id: target
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.target_sha }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected_sha="${INPUT_SHA:-${TRIGGER_SHA}}"
          [[ "${expected_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::A full 40-character commit SHA is required."
            exit 1
          }
          echo "expected_sha=${expected_sha,,}" >> "$GITHUB_OUTPUT"

      - name: Check out exact target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.expected_sha }}
          persist-credentials: false

      - name: Verify checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, mysqli, openssl, pcre, pdo_mysql, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare hermetic Laravel environment file
        run: touch .env

      - name: Verify clean MySQL database before migration
        shell: bash
        run: |
          set -euo pipefail
          tables="$(mysql -h 127.0.0.1 -uroot -proot arna_finance_phase1_test -Nse "SHOW TABLES" | wc -l)"
          echo "Tables before migration: ${tables}"
          test "${tables}" -eq 0

      - name: Run all registered migrations on disposable MySQL 8.0
        run: php artisan migrate --force -vvv

      - name: Run Finance General Ledger feature regressions on MySQL
        run: php artisan test --compact mases_core/src/Domains/Finance/Tests/Feature/FinanceGeneralLedgerTest.php

      - name: Run bounded multi-process MySQL concurrency protocol
        timeout-minutes: 20
        run: |
          set -o pipefail
          php mases_core/src/Domains/Finance/Tests/Support/mysql-concurrency-harness.php 2>&1 | tee finance-phase1-concurrency-evidence.txt

      - name: Capture exact-commit and migration evidence
        if: always()
        shell: bash
        run: |
          {
            echo "Expected SHA: ${{ steps.target.outputs.expected_sha }}"
            echo "Actual SHA: $(git rev-parse HEAD)"
            php --version
            mysql --version
            php artisan migrate:status 2>&1 || true
          } > finance-phase1-mysql-evidence.txt

      - name: Upload Finance Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-phase1-mysql-evidence-${{ github.run_id }}
          path: |
            finance-phase1-mysql-evidence.txt
            finance-phase1-concurrency-evidence.txt
          if-no-files-found: warn
          retention-days: 14
