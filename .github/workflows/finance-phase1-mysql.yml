name: ARNA Finance Phase 1 MySQL integrity

on:
  push:
    branches:
      - feat/finance-gl-integrity-phase1
    paths:
      - ".github/workflows/finance-phase1-mysql.yml"
      - "mases_core/src/Domains/Finance/**"
      - "bootstrap/providers.php"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character commit SHA to verify (defaults to the selected ref)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: arna-finance-phase1-mysql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finance-integrity:
    name: Finance migration and GL integrity regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arna_finance_phase1_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: arna_finance_phase1_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Resolve exact target commit
        id: target
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.target_sha }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected_sha="${INPUT_SHA:-${TRIGGER_SHA}}"
          [[ "${expected_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::A full 40-character commit SHA is required."
            exit 1
          }
          echo "expected_sha=${expected_sha,,}" >> "$GITHUB_OUTPUT"

      - name: Check out exact target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.expected_sha }}
          persist-credentials: false

      - name: Verify checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, mysqli, openssl, pcre, pdo_mysql, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit locked Composer dependencies
        run: composer audit --locked

      - name: Prepare hermetic Laravel environment file
        run: touch .env

      - name: Verify clean MySQL database before migration
        shell: bash
        run: |
          set -euo pipefail
          tables="$(mysql -h 127.0.0.1 -uroot -proot arna_finance_phase1_test -Nse "SHOW TABLES" | wc -l)"
          echo "Tables before migration: ${tables}"
          test "${tables}" -eq 0

      - name: Run all registered migrations on disposable MySQL 8.0
        run: php artisan migrate --force -vvv

      - name: Validate concurrency harness PHP syntax
        run: php -l mases_core/src/Domains/Finance/Tests/Support/mysql-concurrency-harness.php

      - name: Verify Finance InnoDB tables and integrity triggers
        shell: bash
        run: |
          set -euo pipefail
          engines="$(mysql -h 127.0.0.1 -uroot -proot arna_finance_phase1_test -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ('legal_entities','ledger_accounts','accounting_periods','journal_entries','journal_lines','finance_audit_entries') AND engine = 'InnoDB'")"
          test "${engines}" -eq 6
          triggers="$(mysql -h 127.0.0.1 -uroot -proot arna_finance_phase1_test -Nse "SELECT COUNT(DISTINCT trigger_name) FROM information_schema.triggers WHERE trigger_schema = DATABASE() AND trigger_name IN ('finance_audit_entries_immutable_update','finance_audit_entries_immutable_delete','journal_entries_immutable_update','journal_entries_validate_source_identity_insert','journal_entries_validate_post','journal_entries_immutable_delete','journal_lines_insert_draft_only','journal_lines_update_draft_only','journal_lines_delete_draft_only','journal_lines_immutable_insert','journal_lines_immutable_update','journal_lines_immutable_delete','journal_entries_validate_cash_flow')")"
          test "${triggers}" -eq 13
          indexes="$(mysql -h 127.0.0.1 -uroot -proot arna_finance_phase1_test -Nse "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema = DATABASE() AND table_name = 'journal_entries' AND non_unique = 0 AND index_name IN ('journal_entries_entity_number_unique','journal_entries_idempotency_unique','journal_entries_source_event_version_unique')")"
          test "${indexes}" -eq 3
          echo "Finance InnoDB tables verified: ${engines}/6"
          echo "Finance integrity triggers verified: ${triggers}/13"
          echo "Journal uniqueness indexes verified: ${indexes}/3"

      - name: Verify Finance API authentication and permission middleware
        shell: bash
        run: |
          set -euo pipefail
          php artisan route:list --path=finance --json > /tmp/finance-routes.json
          php -r '
          $routes = json_decode(file_get_contents("/tmp/finance-routes.json"), true, 512, JSON_THROW_ON_ERROR);
          $routes = array_values(array_filter($routes, static fn (array $route): bool => str_contains((string) ($route["uri"] ?? ""), "finance/")));
          if (count($routes) !== 20) {
              fwrite(STDERR, "Expected 20 registered Finance API routes; found ".count($routes)."\n");
              exit(1);
          }
          foreach ($routes as $route) {
              $middleware = $route["middleware"] ?? [];
              $middleware = is_array($middleware) ? $middleware : [(string) $middleware];
              $hasAuthentication = (bool) array_filter(
                  $middleware,
                  static fn (string $item): bool => $item === "auth:sanctum"
                      || (str_contains($item, "Authenticate:sanctum")),
              );
              $hasTenantMembership = (bool) array_filter(
                  $middleware,
                  static fn (string $item): bool => $item === "tenant.membership"
                      || str_contains($item, "TenantMembershipMiddleware"),
              );
              $hasFinancePermission = (bool) array_filter(
                  $middleware,
                  static fn (string $item): bool => str_starts_with($item, "auth.permission:")
                      || (str_contains($item, "AuthorizationMiddleware:") && str_contains($item, "finance.")),
              );
              foreach ([
                  "authentication" => $hasAuthentication,
                  "tenant membership" => $hasTenantMembership,
                  "explicit Finance permission" => $hasFinancePermission,
              ] as $control => $present) {
                  if (!$present) {
                      fwrite(STDERR, "Missing {$control} on ".($route["uri"] ?? "unknown route")."; middleware=".json_encode($middleware)."\n");
                      exit(1);
                  }
              }
          }
          echo "Finance API route protection verified: ".count($routes)."/20 routes\n";
          '

      - name: Run all Finance domain tests on MySQL
        run: php artisan test --compact mases_core/src/Domains/Finance/Tests

      - name: Run bounded multi-process MySQL concurrency protocol
        timeout-minutes: 20
        run: |
          set -o pipefail
          php mases_core/src/Domains/Finance/Tests/Support/mysql-concurrency-harness.php 2>&1 | tee finance-phase1-concurrency-evidence.txt

      - name: Capture exact-commit and migration evidence
        if: always()
        shell: bash
        run: |
          {
            echo "Expected SHA: ${{ steps.target.outputs.expected_sha }}"
            echo "Actual SHA: $(git rev-parse HEAD)"
            php --version
            mysql --version
            mysql -h 127.0.0.1 -uroot -proot arna_finance_phase1_test -e "SELECT VERSION() AS mysql_version, @@transaction_isolation AS transaction_isolation"
            mysql -h 127.0.0.1 -uroot -proot arna_finance_phase1_test -e "SELECT TABLE_NAME, ENGINE FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ('legal_entities','ledger_accounts','accounting_periods','journal_entries','journal_lines','finance_audit_entries') ORDER BY TABLE_NAME"
            mysql -h 127.0.0.1 -uroot -proot arna_finance_phase1_test -e "SELECT TRIGGER_NAME, EVENT_OBJECT_TABLE, ACTION_TIMING, EVENT_MANIPULATION FROM information_schema.triggers WHERE trigger_schema = DATABASE() ORDER BY EVENT_OBJECT_TABLE, TRIGGER_NAME"
            mysql -h 127.0.0.1 -uroot -proot arna_finance_phase1_test -e "SELECT TABLE_NAME, INDEX_NAME, NON_UNIQUE, GROUP_CONCAT(COLUMN_NAME ORDER BY SEQ_IN_INDEX) AS COLUMNS_IN_INDEX FROM information_schema.statistics WHERE table_schema = DATABASE() AND table_name IN ('journal_entries','journal_lines') GROUP BY TABLE_NAME, INDEX_NAME, NON_UNIQUE ORDER BY TABLE_NAME, INDEX_NAME"
            php artisan migrate:status 2>&1 || true
          } > finance-phase1-mysql-evidence.txt

      - name: Upload Finance Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-phase1-mysql-evidence-${{ github.run_id }}
          path: |
            finance-phase1-mysql-evidence.txt
            finance-phase1-concurrency-evidence.txt
          if-no-files-found: warn
          retention-days: 14
