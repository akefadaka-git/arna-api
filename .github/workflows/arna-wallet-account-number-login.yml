name: ARNA wallet account-number login candidate

on:
  pull_request:
    branches:
      - integration/arna-system-consolidation
      - codex/arna-wallet-account-number-login
    paths:
      - "database/migrations/**"
      - "mases_core/src/Auth/Services/LoginIdentifierResolver.php"
      - "tests/Feature/WalletAccountNumberLoginTest.php"
      - "tests/Feature/LoginIdentifierResolverTest.php"
      - "tests/Feature/AuthenticationLifecycleTest.php"
      - "tests/Feature/C09/TenantResolutionTest.php"
      - "tests/Feature/TenantMembershipLifecycleTest.php"
      - "tests/Feature/TenantMembershipTest.php"
      - "tests/Feature/LoginThrottlingTest.php"
      - "tests/Unit/TenantResolverTest.php"
      - "tests/Unit/ExplicitTenantContextAuthorizationTest.php"
      - "tests/Unit/UserPermissionScopeTest.php"
      - ".github/workflows/arna-wallet-account-number-login.yml"
      - ".github/workflows/arna-wallet-database-compatibility.yml"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
  push:
    branches:
      - codex/arna-wallet-account-number-login
      - codex/arna-wallet-tenant-integrity-reconciled
    paths:
      - "database/migrations/**"
      - "mases_core/src/Auth/Services/LoginIdentifierResolver.php"
      - "tests/Feature/WalletAccountNumberLoginTest.php"
      - "tests/Feature/LoginIdentifierResolverTest.php"
      - "tests/Feature/AuthenticationLifecycleTest.php"
      - "tests/Feature/C09/TenantResolutionTest.php"
      - "tests/Feature/TenantMembershipLifecycleTest.php"
      - "tests/Feature/TenantMembershipTest.php"
      - "tests/Feature/LoginThrottlingTest.php"
      - "tests/Unit/TenantResolverTest.php"
      - "tests/Unit/ExplicitTenantContextAuthorizationTest.php"
      - "tests/Unit/UserPermissionScopeTest.php"
      - ".github/workflows/arna-wallet-account-number-login.yml"
      - ".github/workflows/arna-wallet-database-compatibility.yml"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"

# Keep the wallet-specific checks and shared authentication gates on the same candidate SHA.
permissions:
  contents: read

concurrency:
  group: arna-wallet-account-number-login-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  wallet-account-number-login:
    name: Wallet and authentication regression (SQLite, PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "Verified exact candidate SHA: $actual_sha"
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, openssl, pcre, pdo_sqlite, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none
      - name: Validate migrations, resolver, and tests
        run: |
          set -euo pipefail
          php -l database/migrations/2026_10_22_000002_add_tenant_wallet_unique_key.php
          php -l database/migrations/2026_10_22_000003_create_wallet_account_identifiers_table.php
          php -l mases_core/src/Auth/Services/LoginIdentifierResolver.php
          php -l tests/Feature/WalletAccountNumberLoginTest.php
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run wallet and identifier resolver regressions
        run: |
          set -euo pipefail
          vendor/bin/phpunit tests/Feature/WalletAccountNumberLoginTest.php
          vendor/bin/phpunit tests/Feature/LoginIdentifierResolverTest.php
      - name: Run tenant resolver regression
        run: vendor/bin/phpunit tests/Unit/TenantResolverTest.php
      - name: Run trusted tenant authorization regression
        run: vendor/bin/phpunit tests/Unit/ExplicitTenantContextAuthorizationTest.php
      - name: Run permission-scope regression
        run: vendor/bin/phpunit tests/Unit/UserPermissionScopeTest.php
      - name: Run authentication lifecycle regression
        run: vendor/bin/phpunit tests/Feature/AuthenticationLifecycleTest.php
      - name: Run C-09 tenant-resolution regression
        run: vendor/bin/phpunit tests/Feature/C09/TenantResolutionTest.php
      - name: Run membership lifecycle regression
        run: vendor/bin/phpunit tests/Feature/TenantMembershipLifecycleTest.php
      - name: Run tenant membership access regression
        run: vendor/bin/phpunit tests/Feature/TenantMembershipTest.php
      - name: Run D-01 login throttling regression
        run: vendor/bin/phpunit tests/Feature/LoginThrottlingTest.php
