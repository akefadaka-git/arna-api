name: ARNA Symfony security dependency remediation

on:
  push:
    branches:
      - feat/ga-statutory-controls-a3-current-main
    paths:
      - ".github/workflows/arna-symfony-security-remediation.yml"
      - "composer.json"
      - "composer.lock"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character commit SHA to resolve and audit"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: arna-symfony-remediation-${{ github.event.inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  resolve-and-audit:
    name: Resolve patched Symfony dependencies and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact target SHA
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.target_sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            expected="${INPUT_SHA}"
          else
            expected="${PUSH_SHA}"
          fi
          [[ "${expected}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "expected_sha=${expected,,}" >> "$GITHUB_OUTPUT"

      - name: Check out exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.expected_sha }}
          persist-credentials: true

      - name: Assert checked-out SHA and prepare environment
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${actual}"
          test "${actual}" = "${EXPECTED_SHA}"
          touch .env

      - name: Set up PHP 8.3 and Composer 2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, openssl, pcre, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Validate baseline manifest and lock
        run: composer validate --no-check-publish

      - name: Resolve patched Symfony components in the existing 7.4 line
        run: |
          composer update symfony/http-kernel symfony/mailer symfony/routing --with-dependencies --no-interaction --no-progress --no-scripts

      - name: Validate resolved lockfile
        run: composer validate --no-check-publish

      - name: Enforce Composer security audit
        run: composer audit --locked --format=plain

      - name: Commit audited dependency lockfile update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "No dependency lockfile change to commit."
          else
            git commit -m "fix(deps): patch Symfony security advisories"
            git push origin HEAD:feat/ga-statutory-controls-a3-current-main
          fi

      - name: Record exact-head remediation evidence
        if: always()
        shell: bash
        run: |
          {
            echo "source_sha=${{ steps.target.outputs.expected_sha }}"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "composer_version=$(composer --version --no-ansi 2>/dev/null || echo unavailable)"
            echo "resolution_exit_status=${{ steps.target.outcome }}"
            echo "audit_job_status=${{ job.status }}"
            echo "resolved_symfony_versions:"
            grep -A 2 -E '"name": "symfony/(http-kernel|mailer|routing)"' composer.lock || true
          } > symfony-security-remediation.txt

      - name: Upload proposed lockfile and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arna-symfony-remediation-${{ github.run_id }}
          path: |
            composer.lock
            symfony-security-remediation.txt
          if-no-files-found: warn
          retention-days: 14
