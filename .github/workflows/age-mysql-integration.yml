name: AGE MySQL integration

on:
  workflow_dispatch:
  push:
    branches:
      - fix/age-a3-frozen-register-db-immutability
    paths:
      - ".github/workflows/age-mysql-integration.yml"
      - "mases_core/src/Domains/Governance/Database/Migrations/**"
      - "tests/Feature/AgeVoterRegisterMySqlIntegrationTest.php"
      - "phpunit.age-mysql.xml"

permissions:
  contents: read

concurrency:
  group: age-mysql-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  age-mysql-integration:
    name: AGE voter-register MySQL trigger tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arna_age_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: arna_age_test
      DB_USERNAME: root
      DB_PASSWORD: root
      AGE_MYSQL_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathai/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, bcmath, xml, ctype, curl, dom, fileinfo, json, tokenizer, pcntl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run AGE MySQL integration tests
        run: vendor/bin/phpunit -c phpunit.age-mysql.xml --testdox

      - name: Preserve PHPUnit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: age-mysql-integration-${{ github.run_id }}
          path: |
            .phpunit.cache/
            storage/logs/
          if-no-files-found: ignore
          retention-days: 7
