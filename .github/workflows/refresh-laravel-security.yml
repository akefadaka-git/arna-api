name: Refresh Laravel framework security patch

on:
  push:
    branches:
      - fix/laravel-framework-security-2026-11

permissions:
  contents: write

jobs:
  refresh-laravel:
    name: Update Laravel framework and lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security-fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up PHP 8.3 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Update Laravel and compatible dependencies
        run: composer update laravel/framework --with-all-dependencies --no-interaction --prefer-dist --no-scripts

      - name: Verify resolved Laravel version
        run: |
          php -r '$lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR); foreach ($lock["packages"] as $package) { if ($package["name"] === "laravel/framework") { echo "laravel/framework " . $package["version"] . PHP_EOL; if (version_compare(ltrim($package["version"], "v"), "12.71.0", "<")) { exit(1); } exit(0); } } exit(1);'

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "Composer lockfile already satisfies the security floor."
          else
            git commit -m "fix(deps): update Laravel framework security patch"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Audit resolved dependencies
        run: composer audit --format=plain
