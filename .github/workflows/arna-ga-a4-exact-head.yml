name: ARNA GA A4 exact-head MySQL and dependency security verification

on:
  push:
    branches:
      - feat/ga-statutory-controls-a3-current-main
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/arna-ga-a4-exact-head.yml"
      - "composer.json"
      - "composer.lock"
      - "database/migrations/**"
      - "mases_core/src/Domains/Governance/**"
      - "tests/Unit/Governance/GovernanceMeetingLegalGateTest.php"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character candidate SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arna-ga-a4-exact-head-${{ github.event.pull_request.head.sha || inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Fresh MySQL, GA suites and Composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arna_ga_a4_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: arna_ga_a4_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Resolve exact target SHA
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_SHA: ${{ inputs.target_sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            expected="${INPUT_SHA}"
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            expected="${PR_SHA}"
          else
            expected="${PUSH_SHA}"
          fi
          [[ "${expected}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "expected_sha=${expected,,}" >> "$GITHUB_OUTPUT"

      - name: Check out exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.expected_sha }}
          persist-credentials: false

      - name: Assert checked-out SHA and prepare Laravel environment
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${actual}"
          test "${actual}" = "${EXPECTED_SHA}"
          touch .env

      - name: Set up PHP 8.3 and Composer 2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, mysqli, openssl, pcre, pdo_mysql, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Enforce Composer security advisory gate against lockfile
        run: composer audit --locked --format=plain

      - name: Verify fresh disposable MySQL database
        run: |
          set -euo pipefail
          count="$(mysql -h 127.0.0.1 -uroot -proot arna_ga_a4_test -Nse "SHOW TABLES" | wc -l)"
          echo "Tables before migration: ${count}"
          test "${count}" -eq 0

      - name: Run every registered migration on fresh MySQL
        run: php artisan migrate --force -vvv

      - name: Verify required GA tables
        run: |
          set -euo pipefail
          for table in governance_meetings governance_meeting_attendance governance_meeting_proxies governance_meeting_penalties; do
            found="$(mysql -h 127.0.0.1 -uroot -proot arna_ga_a4_test -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='arna_ga_a4_test' AND table_name='${table}'")"
            echo "${table}: ${found}"
            test "${found}" -eq 1
          done

      - name: Run GA legal-gate unit suite
        run: php artisan test --compact tests/Unit/Governance/GovernanceMeetingLegalGateTest.php

      - name: Run GA business-lifecycle feature suite on MySQL
        run: php artisan test --compact mases_core/src/Domains/Governance/Tests/Feature/GovernanceMeetingBusinessLifecycleTest.php

      - name: Confirm no pending migrations
        run: php artisan migrate:status

      - name: Upload exact-head A4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arna-ga-a4-exact-head-${{ github.run_id }}
          path: |
            storage/logs/laravel.log
          if-no-files-found: warn
          retention-days: 14
