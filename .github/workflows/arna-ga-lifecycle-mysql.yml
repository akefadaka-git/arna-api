name: ARNA GA lifecycle and legal-gate exact-head MySQL verification

on:
  push:
    branches: [feat/ga-statutory-controls-a3-current-main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/arna-ga-lifecycle-mysql.yml"
      - "mases_core/src/Domains/Governance/**"
      - "tests/Unit/Governance/GovernanceMeetingLegalGateTest.php"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character commit SHA to test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arna-ga-mysql-${{ github.event.pull_request.head.sha || inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  ga-mysql:
    name: GA lifecycle and legal gates on disposable MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arna_ga_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: arna_ga_lifecycle_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Resolve exact candidate SHA
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_SHA: ${{ inputs.target_sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            expected="${INPUT_SHA}"
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            expected="${PR_SHA}"
          else
            expected="${PUSH_SHA}"
          fi
          [[ "${expected}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "expected_sha=${expected,,}" >> "$GITHUB_OUTPUT"

      - name: Check out exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.expected_sha }}
          persist-credentials: false

      - name: Assert checkout matches candidate SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${actual}"
          test "${actual}" = "${EXPECTED_SHA}"

      - name: Create runner-local Laravel environment
        run: touch .env

      - name: Set up PHP 8.3 and MySQL extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, mysqli, openssl, pcre, pdo_mysql, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify disposable MySQL starts empty
        shell: bash
        run: |
          set -euo pipefail
          count="$(mysql -h 127.0.0.1 -uroot -proot arna_ga_lifecycle_test -Nse "SHOW TABLES" | wc -l)"
          echo "Tables before migration: ${count}"
          test "${count}" -eq 0

      - name: Run every registered migration on fresh MySQL
        run: php artisan migrate --force -vvv

      - name: Verify GA legal evidence and lifecycle tables exist
        shell: bash
        run: |
          set -euo pipefail
          for table in governance_meetings governance_meeting_attendance governance_meeting_proxies governance_meeting_penalties; do
            found="$(mysql -h 127.0.0.1 -uroot -proot arna_ga_lifecycle_test -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='arna_ga_lifecycle_test' AND table_name='${table}'")"
            echo "${table}: ${found}"
            test "${found}" -eq 1
          done
          php artisan migrate:status

      - name: Confirm disposable MySQL is reachable before GA suites
        run: mysql -h 127.0.0.1 -uroot -proot arna_ga_lifecycle_test -Nse "SELECT 1"

      - name: Run GA legal-gate unit suite in the MySQL verification job
        # This suite is intentionally database-independent; it runs under the
        # same exact-head disposable-MySQL job without overriding DB_CONNECTION.
        run: php artisan test --compact tests/Unit/Governance/GovernanceMeetingLegalGateTest.php

      - name: Run GA business-lifecycle feature suite against MySQL
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: arna_ga_lifecycle_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact mases_core/src/Domains/Governance/Tests/Feature/GovernanceMeetingBusinessLifecycleTest.php

      - name: Confirm no pending migrations
        run: php artisan migrate:status

      - name: Upload exact-head GA verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arna-ga-mysql-evidence-${{ github.run_id }}
          path: |
            storage/logs/laravel.log
          if-no-files-found: warn
          retention-days: 14
