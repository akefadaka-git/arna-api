name: ARNA Executive Overview A4 API security verification

on:
  push:
    branches: ["verify/**"]
    paths:
      - ".github/workflows/executive-overview-a4-api.yml"
      - "app/Http/Controllers/ExecutiveOverviewController.php"
      - "mases_core/src/Domains/Finance/Policies/FinancePolicy.php"
      - "mases_core/src/Authorization/ExecutiveOverviewAccessPolicy.php"
      - "tests/Feature/ExecutiveOverview*.php"
      - "docs/dashboard/ARNA-EXECUTIVE-OVERVIEW-A4-SECURITY-VERIFICATION.md"

permissions:
  contents: read

concurrency:
  group: executive-overview-a4-api-${{ github.sha }}
  cancel-in-progress: false

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arna_a4_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: arna_a4_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, mysqli, openssl, pcre, pdo_mysql, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none
      - name: Verify exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "A4 target SHA: ${GITHUB_SHA}"
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Lint A4 PHP files
        run: |
          php -l app/Http/Controllers/ExecutiveOverviewController.php
          php -l mases_core/src/Domains/Finance/Policies/FinancePolicy.php
          php -l tests/Feature/ExecutiveOverviewA4FreshAuthorizationTest.php
      - name: Run clean MySQL migrations
        run: php artisan migrate --force
      - name: Run frozen audience and wildcard authorization tests
        run: php artisan test --compact tests/Feature/ExecutiveOverviewAuthorizationTest.php
      - name: Run route, metadata disclosure and no-store tests
        run: php artisan test --compact tests/Feature/ExecutiveOverviewRouteTest.php
      - name: Run A4 stale-cache revocation and tenant-isolation tests
        run: php artisan test --compact tests/Feature/ExecutiveOverviewA4FreshAuthorizationTest.php
      - name: Run Finance permission catalogue tests
        run: php artisan test --compact mases_core/src/Domains/Finance/Tests/Unit/FinancePermissionCatalogueTest.php
