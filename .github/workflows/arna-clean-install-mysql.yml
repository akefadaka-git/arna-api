name: ARNA clean-install MySQL verification

on:
  push:
    branches: [main]
  pull_request:
    # Include the active stacked People implementation PR base as well as main.
    # This lets the same clean-install gate run automatically for PR #23.
    branches: [main, feat/p1-4-people-domain-production, feat/people-domain-phase-2-api]
    paths:
      - ".github/workflows/arna-clean-install-mysql.yml"
      - "bootstrap/app.php"
      - "mases_core/src/Exceptions/ErrorCodeRegistry.php"
      - "mases_core/src/Monitoring/ErrorDiagnosticEngine.php"
      - "tests/Unit/ErrorDiagnosticEngineTest.php"
      - "database/migrations/**"
      - "mases_core/src/**/Database/Migrations/**"
      - "mases_core/src/**/Providers/**"
      - "mases_core/src/Domains/Finance/**"
      - "bootstrap/providers.php"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
      - "config/app.php"
      - "database/seeders/**"
      - "tests/Unit/DemoSeederGuardTest.php"
      - "tests/Concerns/LoanDatabaseMigrations.php"
      - "tests/Feature/PersonIdentityContractTest.php"
      - "tests/Feature/PersonApiIntegrationTest.php"
      - "tests/Feature/PersonIdentityMySqlConcurrencyTest.php"
      - "tests/Feature/GovernanceInvariantsMySqlConcurrencyTest.php"
      - "tests/Feature/OrganizationDomainTest.php"
      - "tests/Feature/OrganizationHierarchyMySqlConcurrencyTest.php"
      - "mases_core/src/Domains/Organization/**"
      - "app/Http/Controllers/PersonController.php"
      - "app/Http/Controllers/PublicContentController.php"
      - "mases_core/src/Domains/PublicContent/**"
      - "tests/Feature/PublicContentModerationTest.php"
      - "routes/console.php"
      - "routes/api.php"
      - "mases_core/src/Domains/People/**"
      - "mases_core/src/Auth/Models/User.php"
      - "mases_core/src/Tenancy/Services/TenantMembershipService.php"
      - "tests/Feature/TenantMembershipLifecycleTest.php"
      - "tests/Feature/TenantMembershipMySqlConcurrencyTest.php"
      - "mases_core/src/Domains/Shareholder/Models/Shareholder.php"
      - "mases_core/src/Domains/Governance/Models/GovernanceMembership.php"
      # Any Loan production code, migration, route, policy, service, or test
      # change must run this financial-integrity gate.
      - "mases_core/src/Domains/Loan/**"
      - "tests/Feature/LoanRepaymentMySqlConcurrencyTest.php"
      - "mases_core/src/Notifications/**"
      - "database/migrations/*create_platform_notifications_table.php"
      - "app/Http/Controllers/NotificationController.php"
      - "tests/Feature/CentralNotificationsTest.php"
      - "mases_core/src/Calendar/**"
      - "mases_core/src/Localization/Calendar/Contracts/**"
      - "mases_core/src/Migrations/*calendar_core_tables.php"
      - "mases_core/src/Migrations/*calendar_lifecycle_tables.php"
      - "tests/Feature/CalendarCoreSecurityTest.php"
      - "tests/Feature/CalendarHttpAuthorizationTest.php"
      - "tests/Feature/CalendarLifecycleTest.php"
      - "tests/Feature/CalendarReminderDispatcherTest.php"
      - "tests/Feature/CalendarReservationConcurrencyTest.php"
      - "tests/Unit/CalendarPermissionCatalogueTest.php"
      - "tests/Unit/EthiopianCalendarTest.php"
      - "database/seeders/Data/PermissionCatalogue.php"
      - "database/seeders/Data/RolePermissionGrants.php"
      - "routes/api.php"
      - "routes/console.php"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character commit SHA to test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arna-clean-install-${{ github.event.pull_request.number || inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  clean-install:
    name: Fresh disposable MySQL migration test
    outputs:
      target_sha: ${{ steps.target.outputs.expected_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arna_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: arna_migration_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Resolve exact target commit
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.target_sha }}
          TRIGGER_SHA: ${{ github.sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            expected_sha="${INPUT_SHA}"
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            expected_sha="${{ github.event.pull_request.head.sha }}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            # A one-off exact-SHA run can be requested by a trusted main-branch
            # commit message containing [clean-install-target:<40-char-sha>].
            target_override="$(printf '%s' "${HEAD_COMMIT_MESSAGE}" | sed -nE 's/.*\[clean-install-target:([0-9a-fA-F]{40})\].*/\1/p' | head -n 1)"
            expected_sha="${target_override:-${TRIGGER_SHA}}"
          else
            expected_sha="${TRIGGER_SHA}"
          fi
          [[ "${expected_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::A full 40-character commit SHA is required."
            exit 1
          }
          echo "expected_sha=${expected_sha,,}" >> "$GITHUB_OUTPUT"

      - name: Check out exact target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.expected_sha }}
          persist-credentials: false

      - name: Create runner-local environment file for Laravel tests
        run: touch .env

      - name: Verify checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, pcntl, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, mysqli, openssl, pcre, pdo_mysql, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Lint every tracked PHP source file
        shell: bash
        run: |
          git ls-files -z -- '*.php' | xargs -0 -n1 php -l

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run centralized error diagnostics unit tests
        run: php artisan test --compact tests/Unit/ErrorDiagnosticEngineTest.php

      - name: Validate bootstrap PHP syntax
        run: php -l bootstrap/app.php

      - name: Check formatting of new diagnostics PHP files
        run: vendor/bin/pint --test mases_core/src/Exceptions/ErrorCodeRegistry.php mases_core/src/Monitoring/ErrorDiagnosticEngine.php tests/Unit/ErrorDiagnosticEngineTest.php



      - name: Run canonical Ethiopian localization regressions
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: php artisan test --compact tests/Unit/LocalizationServiceTest.php

      - name: Run focused demo seeder guard tests
        run: php artisan test --compact tests/Unit/DemoSeederGuardTest.php

      - name: Run Loan domain unit tests with hermetic SQLite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: php artisan test --compact mases_core/src/Domains/Loan/Tests/Unit

      - name: Run loan repayment HTTP and financial-invariant regression tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: php artisan test --compact mases_core/src/Domains/Loan/Tests/Feature/LoanRepaymentTest.php


      - name: Run Person identity contract regressions
        if: ${{ hashFiles('tests/Feature/PersonIdentityContractTest.php') != '' }}
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: php artisan test --compact tests/Feature/PersonIdentityContractTest.php

      - name: Run People Profile API integration regressions
        if: ${{ hashFiles('tests/Feature/PersonApiIntegrationTest.php') != '' }}
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: php artisan test --compact tests/Feature/PersonApiIntegrationTest.php

      - name: Run Organization domain tenant and lifecycle regressions
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: php artisan test --compact tests/Feature/OrganizationDomainTest.php

      - name: Run public content moderation lifecycle regressions
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: php artisan test --compact tests/Feature/PublicContentModerationTest.php

      - name: Confirm test database is empty
        shell: bash
        run: |
          set -euo pipefail
          tables="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SHOW TABLES" | wc -l)"
          echo "Tables before migration: ${tables}"
          test "${tables}" -eq 0

      - name: Run all registered migrations on empty MySQL
        run: php artisan migrate --force -vvv

      - name: Run tenant membership lifecycle and audit atomicity tests on MySQL
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: arna_migration_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact tests/Feature/TenantMembershipLifecycleTest.php

      - name: Run independent-connection membership lifecycle concurrency regression on MySQL
        env:
          ARNA_RUN_MYSQL_CONCURRENCY: "1"
          DB_CONNECTION: mysql
          DB_DATABASE: arna_migration_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact tests/Feature/TenantMembershipMySqlConcurrencyTest.php

      - name: Run Calendar tenant isolation, authorization, lifecycle, recurrence and concurrency regressions on migrated MySQL
        env:
          ARNA_RUN_MYSQL_CONCURRENCY: "1"
          DB_CONNECTION: mysql
          DB_DATABASE: arna_migration_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact tests/Feature/CalendarCoreSecurityTest.php tests/Feature/CalendarHttpAuthorizationTest.php tests/Feature/CalendarReservationConcurrencyTest.php tests/Feature/CalendarLifecycleTest.php tests/Feature/CalendarReminderDispatcherTest.php tests/Unit/CalendarPermissionCatalogueTest.php tests/Unit/EthiopianCalendarTest.php

      - name: Verify Calendar reminder dispatcher command and scheduler registration
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: arna_migration_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan calendar:dispatch-reminders --limit=10
          php artisan schedule:list | grep -F "calendar:dispatch-reminders"

      - name: Run Finance domain regressions on migrated MySQL
        run: php artisan test --compact mases_core/src/Domains/Finance/Tests/Unit/FinancePermissionCatalogueTest.php

      - name: Lint Finance Governance settlement migration
        run: php -l mases_core/src/Domains/Finance/Database/Migrations/2026_11_02_120000_create_governance_settlement_finance_tables.php

      - name: Run Finance Governance settlement administration tests on MySQL
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: arna_migration_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan test --compact mases_core/src/Domains/Finance/Tests/Feature/GovernancePenaltySettlementServiceTest.php
          php artisan test --compact mases_core/src/Domains/Finance/Tests/Feature/GovernancePenaltySettlementAccountingTest.php

      - name: Lint Finance settlement authorization tests
        run: php -l mases_core/src/Domains/Finance/Tests/Feature/GovernancePenaltySettlementAuthorizationTest.php

      - name: Run Finance settlement authorization tests on MySQL
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: arna_migration_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact mases_core/src/Domains/Finance/Tests/Feature/GovernancePenaltySettlementAuthorizationTest.php

      - name: Lint Governance attendance review migration
        run: php -l mases_core/src/Domains/Governance/Database/Migrations/2026_11_02_110000_create_governance_attendance_review_tables.php

      - name: Run Governance meeting attendance and penalty regressions on migrated MySQL
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: arna_migration_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact mases_core/src/Domains/Governance/Tests/Feature/GovernanceMeetingAttendanceTest.php

      - name: Run centralized notification tenant-isolation feature tests on MySQL
        if: ${{ hashFiles('tests/Feature/CentralNotificationsTest.php') != '' }}
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: arna_migration_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact tests/Feature/CentralNotificationsTest.php

      - name: Run announcement security, lifecycle and atomicity feature tests on MySQL
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: arna_migration_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact tests/Feature/CommunicationAnnouncementsTest.php

      - name: Run independent-connection People identity concurrency regression
        if: ${{ hashFiles('tests/Feature/PersonIdentityMySqlConcurrencyTest.php') != '' }}
        env:
          ARNA_RUN_MYSQL_CONCURRENCY: "1"
          DB_CONNECTION: mysql
          DB_DATABASE: arna_migration_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact tests/Feature/PersonIdentityMySqlConcurrencyTest.php

      - name: Run independent-connection Governance invariant concurrency regression
        env:
          ARNA_RUN_MYSQL_CONCURRENCY: "1"
          DB_CONNECTION: mysql
          DB_DATABASE: arna_migration_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact tests/Feature/GovernanceInvariantsMySqlConcurrencyTest.php

      - name: Run Organization hierarchy concurrent mutation regression
        env:
          ARNA_RUN_MYSQL_CONCURRENCY: "1"
          DB_CONNECTION: mysql
          DB_DATABASE: arna_migration_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact tests/Feature/OrganizationHierarchyMySqlConcurrencyTest.php

      - name: Verify expected core and domain tables
        shell: bash
        run: |
          set -euo pipefail
          for table in tenants users versioned_policies shareholders governance_bodies people employees governance_memberships person_tenant_accesses governance_authority_grants governance_seats governance_seat_occupancies governance_acting_assignments governance_meetings governance_meeting_attendance governance_meeting_proxies governance_meeting_penalties governance_penalty_settlements governance_meeting_activity governance_attendance_corrections governance_penalty_disputes person_document_links organization_units organization_assignments organization_audit_events public_contents public_content_email_verifications platform_notifications communication_announcements communication_announcement_recipients legal_entities ledger_accounts accounting_periods journal_entries journal_lines finance_audit_entries journal_source_entity_mappings finance_consolidation_account_mappings finance_exchange_rates corporate_site_pages corporate_site_entries corporate_site_inquiries; do
            found="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='arna_migration_test' AND table_name='${table}'")"
            echo "${table}: ${found}"
            test "${found}" -eq 1
          done
          applied="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SELECT COUNT(*) FROM migrations")"
          echo "Applied migration records: ${applied}"
          test "${applied}" -eq 78
          foreign_keys="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SELECT COUNT(*) FROM information_schema.KEY_COLUMN_USAGE WHERE TABLE_SCHEMA='arna_migration_test' AND REFERENCED_TABLE_NAME IS NOT NULL")"
          echo "Foreign-key constraints: ${foreign_keys}"
          test "${foreign_keys}" -gt 0

      - name: Run corporate publishing feature tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: php artisan test --compact tests/Feature/CorporateSitePublishingTest.php

      - name: Run shareholder seed numbering regression tests
        # Keep framework regression tests hermetic. The MySQL clean-install
        # migration checks above and below independently verify the real MySQL
        # schema; this test suite uses the SQLite in-memory connection declared
        # by phpunit.xml and must not inherit the job's MySQL service variables.
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: php artisan test --compact tests/Feature/ShareholderSeedNumberInitializationTest.php

      - name: Run migrations a second time (idempotence)
        run: php artisan migrate --force -vvv

      - name: Verify full fresh migration and seed on disposable MySQL
        # Explicitly permit demo/bootstrap seed data only inside this disposable CI database.
        # Production environments must never set this flag.
        env:
          MASES_ENABLE_DEMO_SEEDING: "true"
        run: php artisan migrate:fresh --seed --force -vvv

      - name: Verify Organization tables after fresh migration and seed
        shell: bash
        run: |
          set -euo pipefail
          for table in governance_meetings governance_meeting_attendance governance_meeting_proxies governance_meeting_penalties governance_penalty_settlements governance_meeting_activity governance_attendance_corrections governance_penalty_disputes organization_units organization_assignments organization_audit_events public_contents public_content_email_verifications communication_announcements communication_announcement_recipients legal_entities ledger_accounts accounting_periods journal_entries journal_lines finance_audit_entries journal_source_entity_mappings finance_consolidation_account_mappings finance_exchange_rates corporate_site_pages corporate_site_entries corporate_site_inquiries; do
            found="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='arna_migration_test' AND table_name='${table}'")"
            echo "${table} after migrate:fresh --seed: ${found}"
            test "${found}" -eq 1
          done
          test "$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SELECT COUNT(*) FROM migrations")" -eq 78

      - name: Confirm no pending migrations
        run: php artisan migrate:status

      - name: Confirm migration record count remains stable
        shell: bash
        run: |
          set -euo pipefail
          applied="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SELECT COUNT(*) FROM migrations")"
          echo "Applied migration records after second run: ${applied}"
          test "${applied}" -eq 76

      # Run functional regressions before the dependency audit so unrelated
      # advisories do not suppress financial test evidence. The audit remains
      # a required, blocking gate and is not skipped or downgraded.
      - name: Run independent-connection Loan repayment concurrency regression on MySQL
        env:
          ARNA_RUN_MYSQL_CONCURRENCY: "1"
          DB_CONNECTION: mysql
          DB_DATABASE: arna_migration_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact tests/Feature/LoanRepaymentMySqlConcurrencyTest.php

      - name: Enforce Composer security advisory gate
        run: composer audit --format=plain

      - name: Upload migration status evidence
        if: always()
        shell: bash
        run: |
          php artisan migrate:status > migration-status.txt 2>&1 || true
          {
            echo "Expected SHA: ${{ steps.target.outputs.expected_sha }}"
            git rev-parse HEAD
            php --version
            mysql --version
            echo "Migration status:"
            cat migration-status.txt
          } > clean-install-evidence.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arna-clean-install-evidence-${{ github.run_id }}
          path: |
            clean-install-evidence.txt
            migration-status.txt
          if-no-files-found: warn
          retention-days: 14
