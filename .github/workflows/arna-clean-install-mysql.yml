name: ARNA clean-install MySQL verification

on:
  push:
    branches: [main]
  pull_request:
    # Include the active stacked People implementation PR base as well as main.
    # This lets the same clean-install gate run automatically for PR #23.
    branches: [main, feat/p1-4-people-domain-production]
    paths:
      - ".github/workflows/arna-clean-install-mysql.yml"
      - "database/migrations/**"
      - "mases_core/src/**/Database/Migrations/**"
      - "mases_core/src/**/Providers/**"
      - "bootstrap/providers.php"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
      - "config/app.php"
      - "database/seeders/**"
      - "tests/Unit/DemoSeederGuardTest.php"
      - "tests/Concerns/LoanDatabaseMigrations.php"
      - "tests/Feature/PersonIdentityContractTest.php"
      - "tests/Feature/PersonApiIntegrationTest.php"
      - "tests/Feature/PersonIdentityMySqlConcurrencyTest.php"
      - "tests/Feature/GovernanceInvariantsMySqlConcurrencyTest.php"
      - "tests/Feature/OrganizationDomainTest.php"
      - "tests/Feature/OrganizationHierarchyMySqlConcurrencyTest.php"
      - "mases_core/src/Domains/Organization/**"
      - "app/Http/Controllers/PersonController.php"
      - "routes/api.php"
      - "mases_core/src/Domains/People/**"
      - "mases_core/src/Auth/Models/User.php"
      - "mases_core/src/Domains/Shareholder/Models/Shareholder.php"
      - "mases_core/src/Domains/Governance/Models/GovernanceMembership.php"
      - "mases_core/src/Domains/Loan/Tests/Unit/**"
      - "mases_core/src/Domains/Finance/**"
      - "mases_core/src/Domains/Loan/Tests/Feature/LoanRepaymentTest.php"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character commit SHA to test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arna-clean-install-${{ github.event.pull_request.number || inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  clean-install:
    name: Fresh disposable MySQL migration test
    outputs:
      target_sha: ${{ steps.target.outputs.expected_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arna_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: arna_migration_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Resolve exact target commit
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.target_sha }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            expected_sha="${INPUT_SHA}"
          else
            expected_sha="${TRIGGER_SHA}"
          fi
          [[ "${expected_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::A full 40-character commit SHA is required."
            exit 1
          }
          echo "expected_sha=${expected_sha,,}" >> "$GITHUB_OUTPUT"

      - name: Check out exact target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.expected_sha }}
          persist-credentials: false

      - name: Verify checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, mysqli, openssl, pcre, pdo_mysql, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run focused demo seeder guard tests
        run: php artisan test --compact tests/Unit/DemoSeederGuardTest.php

      - name: Run Loan domain unit tests with hermetic SQLite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: php artisan test --compact mases_core/src/Domains/Loan/Tests/Unit

      - name: Run Finance foundation schema and unit regressions
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: php artisan test --compact mases_core/src/Domains/Finance/Tests/Unit

      - name: Run loan repayment HTTP and financial-invariant regression tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: php artisan test --compact mases_core/src/Domains/Loan/Tests/Feature/LoanRepaymentTest.php

      - name: Run Person identity contract regressions
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: php artisan test --compact tests/Feature/PersonIdentityContractTest.php

      - name: Run People Profile API integration regressions
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: php artisan test --compact tests/Feature/PersonApiIntegrationTest.php

      - name: Run Organization domain tenant and lifecycle regressions
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: php artisan test --compact tests/Feature/OrganizationDomainTest.php

      - name: Confirm test database is empty
        shell: bash
        run: |
          set -euo pipefail
          tables="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SHOW TABLES" | wc -l)"
          echo "Tables before migration: ${tables}"
          test "${tables}" -eq 0

      - name: Run all registered migrations on empty MySQL
        run: php artisan migrate --force -vvv

      - name: Run independent-connection People identity concurrency regression
        env:
          ARNA_RUN_MYSQL_CONCURRENCY: "1"
          DB_CONNECTION: mysql
          DB_DATABASE: arna_migration_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact tests/Feature/PersonIdentityMySqlConcurrencyTest.php

      - name: Run independent-connection Governance invariant concurrency regression
        env:
          ARNA_RUN_MYSQL_CONCURRENCY: "1"
          DB_CONNECTION: mysql
          DB_DATABASE: arna_migration_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact tests/Feature/GovernanceInvariantsMySqlConcurrencyTest.php

      - name: Run Organization hierarchy concurrent mutation regression
        env:
          ARNA_RUN_MYSQL_CONCURRENCY: "1"
          DB_CONNECTION: mysql
          DB_DATABASE: arna_migration_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact tests/Feature/OrganizationHierarchyMySqlConcurrencyTest.php

      - name: Verify expected core and domain tables
        shell: bash
        run: |
          set -euo pipefail
          for table in tenants users versioned_policies shareholders governance_bodies people employees governance_memberships person_tenant_accesses governance_authority_grants governance_seats governance_seat_occupancies governance_acting_assignments person_document_links organization_units organization_assignments organization_audit_events; do
            found="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='arna_migration_test' AND table_name='${table}'")"
            echo "${table}: ${found}"
            test "${found}" -eq 1
          done
          applied="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SELECT COUNT(*) FROM migrations")"
          echo "Applied migration records: ${applied}"
          test "${applied}" -eq 61
          foreign_keys="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SELECT COUNT(*) FROM information_schema.KEY_COLUMN_USAGE WHERE TABLE_SCHEMA='arna_migration_test' AND REFERENCED_TABLE_NAME IS NOT NULL")"
          echo "Foreign-key constraints: ${foreign_keys}"
          test "${foreign_keys}" -gt 0

      - name: Run shareholder seed numbering regression tests
        # Keep framework regression tests hermetic. The MySQL clean-install
        # migration checks above and below independently verify the real MySQL
        # schema; this test suite uses the SQLite in-memory connection declared
        # by phpunit.xml and must not inherit the job's MySQL service variables.
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: php artisan test --compact tests/Feature/ShareholderSeedNumberInitializationTest.php

      - name: Run migrations a second time (idempotence)
        run: php artisan migrate --force -vvv

      - name: Verify full fresh migration and seed on disposable MySQL
        # Explicitly permit demo/bootstrap seed data only inside this disposable CI database.
        # Production environments must never set this flag.
        env:
          MASES_ENABLE_DEMO_SEEDING: "true"
        run: php artisan migrate:fresh --seed --force -vvv

      - name: Verify Organization tables after fresh migration and seed
        shell: bash
        run: |
          set -euo pipefail
          for table in organization_units organization_assignments organization_audit_events; do
            found="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='arna_migration_test' AND table_name='${table}'")"
            echo "${table} after migrate:fresh --seed: ${found}"
            test "${found}" -eq 1
          done
          test "$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SELECT COUNT(*) FROM migrations")" -eq 61

      - name: Confirm no pending migrations
        run: php artisan migrate:status

      - name: Confirm migration record count remains stable
        shell: bash
        run: |
          set -euo pipefail
          applied="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SELECT COUNT(*) FROM migrations")"
          echo "Applied migration records after second run: ${applied}"
          test "${applied}" -eq 61

      - name: Upload migration status evidence
        if: always()
        shell: bash
        run: |
          php artisan migrate:status > migration-status.txt 2>&1 || true
          {
            echo "Expected SHA: ${{ steps.target.outputs.expected_sha }}"
            git rev-parse HEAD
            php --version
            mysql --version
            echo "Migration status:"
            cat migration-status.txt
          } > clean-install-evidence.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arna-clean-install-evidence-${{ github.run_id }}
          path: |
            clean-install-evidence.txt
            migration-status.txt
          if-no-files-found: warn
          retention-days: 14

  cleanup-merged-source-branches:
    name: Clean up merged source branches after successful main verification
    if: ${{ needs.clean-install.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: clean-install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete only safe, fully merged source branches associated with this exact main commit
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ needs.clean-install.outputs.target_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = process.env.TARGET_SHA;
            core.info(`Post-merge verification succeeded for exact main SHA: ${sha}`);
            const repository = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.data.default_branch;

            // Refuse cleanup unless the exact tested SHA is already reachable from
            // the default branch. This permits targeted checks of old merge commits.
            const comparison = await github.rest.repos.compareCommits({
              owner, repo, base: sha, head: defaultBranch
            });
            if (comparison.data.merge_base_commit?.sha !== sha) {
              core.setFailed(`Target SHA ${sha} is not an ancestor of ${defaultBranch}; refusing branch cleanup.`);
              return;
            }

            // Discover merged PRs independently of the push/dispatch SHA.
            const closedPRs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'closed', base: defaultBranch, per_page: 100
            });
            const prs = closedPRs.filter(pr => pr.merged_at && pr.base.ref === defaultBranch);
            core.info(`Found ${prs.length} merged PR(s) targeting ${defaultBranch}.`);

            const protectedName = /^(main|master|develop|development|integration(?:\/.*)?|release(?:\/.*)?|hotfix(?:\/.*)?)$/i;
            const consideredBranches = new Set();
            for (const pr of prs) {
              const branch = pr.head.ref;
              const headRepo = pr.head.repo?.full_name;
              if (consideredBranches.has(branch)) {
                core.info(`Skip duplicate candidate ${branch}; already evaluated from an earlier merged PR.`);
                continue;
              }
              consideredBranches.add(branch);
              if (!pr.merged_at || pr.state !== 'closed') {
                core.info(`Skip PR #${pr.number}: not confirmed merged and closed.`);
                continue;
              }
              if (headRepo !== `${owner}/${repo}`) {
                core.info(`Skip PR #${pr.number}: source branch belongs to ${headRepo || 'a deleted/unknown repository'}.`);
                continue;
              }
              if (branch === defaultBranch || protectedName.test(branch)) {
                core.info(`Skip protected/long-lived branch ${branch} from PR #${pr.number}.`);
                continue;
              }
              let current;
              try {
                current = await github.rest.repos.getBranch({ owner, repo, branch });
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Branch ${branch} is already absent.`);
                  continue;
                }
                throw error;
              }
              if (current.data.commit.sha !== pr.head.sha) {
                core.warning(`Skip ${branch}: branch advanced after PR #${pr.number}; current=${current.data.commit.sha}, merged-head=${pr.head.sha}.`);
                continue;
              }
              const openPRs = await github.rest.pulls.list({
                owner, repo, state: 'open', head: `${owner}:${branch}`, per_page: 100
              });
              if (openPRs.data.length > 0) {
                core.warning(`Skip ${branch}: ${openPRs.data.length} open pull request(s) still use it.`);
                continue;
              }
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                core.notice(`Deleted merged source branch ${branch} (PR #${pr.number}, head ${pr.head.sha}).`);
              } catch (error) {
                if (error.status === 422 || error.status === 403) {
                  core.warning(`Could not delete ${branch}; it may be protected or repository policy may prohibit deletion. ${error.message}`);
                  continue;
                }
                throw error;
              }
            }
