name: ARNA clean-install MySQL verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/arna-clean-install-mysql.yml"
      - "database/migrations/**"
      - "mases_core/src/**/Database/Migrations/**"
      - "mases_core/src/**/Providers/**"
      - "bootstrap/providers.php"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character commit SHA to test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arna-clean-install-${{ github.event.pull_request.number || inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  clean-install:
    name: Fresh disposable MySQL migration test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arna_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: arna_migration_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Resolve exact target commit
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.target_sha }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            expected_sha="${INPUT_SHA}"
          else
            expected_sha="${TRIGGER_SHA}"
          fi
          [[ "${expected_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::A full 40-character commit SHA is required."
            exit 1
          }
          echo "expected_sha=${expected_sha,,}" >> "$GITHUB_OUTPUT"

      - name: Check out exact target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.expected_sha }}
          persist-credentials: false

      - name: Verify checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, mysqli, openssl, pcre, pdo_mysql, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Confirm test database is empty
        shell: bash
        run: |
          set -euo pipefail
          tables="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SHOW TABLES" | wc -l)"
          echo "Tables before migration: ${tables}"
          test "${tables}" -eq 0

      - name: Run all registered migrations on empty MySQL
        run: php artisan migrate --force -vvv

      - name: Verify expected core and domain tables
        shell: bash
        run: |
          set -euo pipefail
          for table in tenants users versioned_policies shareholders governance_bodies; do
            found="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='arna_migration_test' AND table_name='${table}'")"
            echo "${table}: ${found}"
            test "${found}" -eq 1
          done
          applied="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SELECT COUNT(*) FROM migrations")"
          echo "Applied migration records: ${applied}"
          test "${applied}" -eq 52
          foreign_keys="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema='arna_migration_test'")"
          echo "Foreign-key constraints: ${foreign_keys}"
          test "${foreign_keys}" -gt 0

      - name: Run migrations a second time (idempotence)
        run: php artisan migrate --force -vvv

      - name: Confirm no pending migrations
        run: php artisan migrate:status

      - name: Confirm migration record count remains stable
        shell: bash
        run: |
          set -euo pipefail
          applied="$(mysql -h 127.0.0.1 -uroot -proot arna_migration_test -Nse "SELECT COUNT(*) FROM migrations")"
          echo "Applied migration records after second run: ${applied}"
          test "${applied}" -eq 52

      - name: Upload migration status evidence
        if: always()
        shell: bash
        run: |
          php artisan migrate:status > migration-status.txt 2>&1 || true
          {
            echo "Expected SHA: ${{ steps.target.outputs.expected_sha }}"
            git rev-parse HEAD
            php --version
            mysql --version
            echo "Migration status:"
            cat migration-status.txt
          } > clean-install-evidence.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arna-clean-install-evidence-${{ github.run_id }}
          path: |
            clean-install-evidence.txt
            migration-status.txt
          if-no-files-found: warn
          retention-days: 14
