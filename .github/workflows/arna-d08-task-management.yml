name: ARNA D08 Task Management verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arna-d08-task-management.yml"
      - "database/migrations/**"
      - "database/seeders/Data/PermissionCatalogue.php"
      - "database/seeders/Data/RolePermissionGrants.php"
      - "database/seeders/PermissionSeeder.php"
      - "mases_core/src/Domains/Task/**"
      - "mases_core/src/Calendar/**"
      - "app/Providers/AppServiceProvider.php"
      - "routes/api.php"
      - "tests/Feature/D08TaskManagementTest.php"
      - "tests/Feature/CalendarTaskLinkTest.php"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/arna-d08-task-management.yml"
      - "database/migrations/**"
      - "database/seeders/Data/PermissionCatalogue.php"
      - "database/seeders/Data/RolePermissionGrants.php"
      - "database/seeders/PermissionSeeder.php"
      - "mases_core/src/Domains/Task/**"
      - "routes/api.php"
      - "tests/Feature/D08TaskManagementTest.php"

permissions:
  contents: read

jobs:
  d08-task-management:
    name: D08 tenant and lifecycle tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create runner-local environment file
        run: touch .env

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, pcntl, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, openssl, pcre, pdo_sqlite, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint D08 PHP source and migration
        run: |
          php -l database/migrations/2026_11_25_000001_create_d08_task_management_tables.php
          php -l mases_core/src/Domains/Task/Http/Controllers/TaskController.php
          php -l mases_core/src/Domains/Task/Models/Task.php
          php -l mases_core/src/Domains/Task/Services/TaskService.php
          php -l tests/Feature/D08TaskManagementTest.php
          php -l routes/api.php

      - name: Run D08 Task Management feature tests
        run: php artisan test --compact tests/Feature/D08TaskManagementTest.php tests/Feature/CalendarTaskLinkTest.php
