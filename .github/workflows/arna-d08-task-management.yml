name: ARNA D08 and Calendar scheduling verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arna-d08-task-management.yml"
      - "database/migrations/**"
      - "database/seeders/Data/PermissionCatalogue.php"
      - "database/seeders/Data/RolePermissionGrants.php"
      - "database/seeders/PermissionSeeder.php"
      - "mases_core/src/Domains/Task/**"
      - "mases_core/src/Calendar/**"
      - "app/Providers/AppServiceProvider.php"
      - "routes/api.php"
      - "tests/Feature/D08TaskManagementTest.php"
      - "tests/Feature/CalendarTaskLinkTest.php"
      - "tests/Feature/CalendarAppointmentBookingTest.php"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/arna-d08-task-management.yml"
      - "database/migrations/**"
      - "database/seeders/Data/PermissionCatalogue.php"
      - "database/seeders/Data/RolePermissionGrants.php"
      - "database/seeders/PermissionSeeder.php"
      - "mases_core/src/Domains/Task/**"
      - "routes/api.php"
      - "tests/Feature/D08TaskManagementTest.php"
      - "mases_core/src/Domains/Governance/**"
      - "tests/Feature/GovernanceMeetingAttendanceTest.php"
      - "mases_core/src/Domains/Governance/Tests/Feature/GovernanceMeetingBusinessLifecycleTest.php"
      - "tests/Unit/Governance/GovernanceMeetingLegalGateTest.php"

permissions:
  contents: read

jobs:
  d08-task-management:
    name: D08 and Calendar tenant/lifecycle tests (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arna_d08_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create runner-local environment file
        run: touch .env

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, pcntl, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, mysqli, openssl, pcre, pdo_mysql, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint D08 and Calendar appointment PHP source and migrations
        run: |
          php -l database/migrations/2026_11_25_000001_create_d08_task_management_tables.php
          php -l database/migrations/2026_11_25_000002_create_task_dependencies_table.php
          php -l mases_core/src/Domains/Task/Http/Controllers/TaskController.php
          php -l mases_core/src/Domains/Task/Models/Task.php
          php -l mases_core/src/Domains/Task/Services/TaskService.php
          php -l tests/Feature/D08TaskManagementTest.php
          php -l routes/api.php

      - name: Run D08, Calendar task and appointment integration tests on MySQL
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: arna_d08_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact tests/Feature/D08TaskManagementTest.php tests/Feature/CalendarTaskLinkTest.php tests/Feature/CalendarAppointmentBookingTest.php
