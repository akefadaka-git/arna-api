name: Owner-approved operations evidence deletion

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: "Exact ops/ evidence branch to retire after its record is preserved"
        required: true
        type: string
      confirm_branch_name:
        description: "Re-enter the exact ops/ branch name"
        required: true
        type: string
      expected_sha:
        description: "Full 40-character current branch head SHA"
        required: true
        type: string
      cleanup_reason:
        description: "Why this evidence ref is now safe to retire"
        required: true
        type: string
      evidence_reference:
        description: "Must be the committed branch cleanup register path"
        required: true
        type: string
      owner_confirmation:
        description: "Type exactly I APPROVE THIS OPS-ONLY REF DELETION"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: owner-approved-ops-evidence-deletion
  cancel-in-progress: false

jobs:
  delete-ops-evidence:
    if: github.actor == 'akefadaka-git'
    runs-on: ubuntu-latest
    steps:
      - name: Verify Owner approval, register and exact ref
        id: request
        shell: bash
        env:
          GH_TOKEN: ${ github.token }}
          REPO: ${ github.repository }}
          ACTOR: ${ github.actor }}
          BRANCH: ${ inputs.branch_name }}
          CONFIRM: ${ inputs.confirm_branch_name }}
          EXPECTED_SHA: ${ inputs.expected_sha }}
          REASON: ${ inputs.cleanup_reason }}
          EVIDENCE: ${ inputs.evidence_reference }}
          OWNER_CONFIRMATION: ${ inputs.owner_confirmation }}
        run: |
          set -euo pipefail
          [[ "$ACTOR" == "akefadaka-git" ]] || { echo "::error::Only the repository Owner may run this workflow."; exit 1; }
          [[ "$BRANCH" == ops/* && "$BRANCH" == "$CONFIRM" ]] || { echo "::error::Only one exact ops/ ref may be retired."; exit 1; }
          [[ "$BRANCH" != ops/dispatch-* ]] || { echo "::error::Spent dispatch refs require workflow-run evidence and separate reconciliation."; exit 1; }
          [[ "$OWNER_CONFIRMATION" == "I APPROVE THIS OPS-ONLY REF DELETION" ]] || { echo "::error::Explicit Owner confirmation is required."; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::A full 40-character SHA is required."; exit 1; }
          [[ -n "$REASON" ]] || { echo "::error::Cleanup reason is required."; exit 1; }
          [[ "$EVIDENCE" == "docs/operations/BRANCH_CLEANUP_REGISTER_2026-11-22.md" ]] || { echo "::error::Evidence reference must be the committed cleanup register."; exit 1; }
          gh api "repos/$REPO/contents/$EVIDENCE" --jq '.sha' >/dev/null
          DEFAULT_BRANCH="$(gh api "repos/$REPO" --jq '.default_branch')"
          [[ "$BRANCH" != "$DEFAULT_BRANCH" && "$BRANCH" != main && "$BRANCH" != master ]] || { echo "::error::Protected default branch cannot be deleted."; exit 1; }
          git check-ref-format --branch "$BRANCH"
          REF_PATH="$(BRANCH="$BRANCH" python -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["BRANCH"],safe=""))')"
          ACTUAL_SHA="$(gh api "repos/$REPO/git/ref/heads/$REF_PATH" --jq '.object.sha')"
          [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]] || { echo "::error::Exact branch-head mismatch. Nothing deleted."; exit 1; }
          OPEN_REFS="$(gh pr list --repo "$REPO" --state open --limit 1000 --json headRefName,baseRefName)"
          [[ "$(jq --arg b "$BRANCH" '[.[] | select(.headRefName == $b or .baseRefName == $b)] | length' <<<"$OPEN_REFS")" == 0 ]] || { echo "::error::An open PR references this evidence ref."; exit 1; }
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Delete only the confirmed ops evidence ref
        shell: bash
        env:
          GH_TOKEN: ${ github.token }}
          REPO: ${ github.repository }}
          BRANCH: ${ steps.request.outputs.branch }}
          EXPECTED_SHA: ${ steps.request.outputs.expected_sha }}
        run: |
          set -euo pipefail
          REF_PATH="$(BRANCH="$BRANCH" python -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["BRANCH"],safe=""))')"
          ACTUAL_SHA="$(gh api "repos/$REPO/git/ref/heads/$REF_PATH" --jq '.object.sha')"
          [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]] || { echo "::error::Branch moved after preflight; nothing deleted."; exit 1; }
          gh api --method DELETE "repos/$REPO/git/refs/heads/$REF_PATH"
          STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/ref-check.json" --write-out '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/git/ref/heads/$REF_PATH")"
          [[ "$STATUS" == 404 ]] || { echo "::error::Ref absence not verified; HTTP $STATUS."; cat "$RUNNER_TEMP/ref-check.json"; exit 1; }
          echo "VERIFIED-CLOSED: $BRANCH at $EXPECTED_SHA; HTTP 404."
