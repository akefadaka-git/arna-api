name: Owner-approved branch deletion

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: Exact branch name to delete
        required: true
        type: string
      confirm_branch_name:
        description: Re-enter the exact branch name to confirm deletion
        required: true
        type: string
  push:
    branches:
      - ops/owner-approved-delete-docs-a2-20261105
    paths:
      - ops/execute-docs-a2-deletion.txt

permissions:
  contents: write

concurrency:
  group: owner-approved-branch-deletion
  cancel-in-progress: false

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit target
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.event_name == 'push' && 'integration/documents-file-management-a2-2026-11-05' || inputs.branch_name }}
          CONFIRM: ${{ github.event_name == 'push' && 'integration/documents-file-management-a2-2026-11-05' || inputs.confirm_branch_name }}
        run: |
          set -euo pipefail
          if [[ -z "$BRANCH" || "$BRANCH" != "$CONFIRM" ]]; then
            echo "::error::Branch name is empty or confirmation does not match."
            exit 1
          fi
          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" ]]; then
            echo "::error::Refusing to delete a protected primary branch."
            exit 1
          fi
          if [[ "$BRANCH" == *".."* || "$BRANCH" == -* || "$BRANCH" == *" "* ]]; then
            echo "::error::Invalid branch name."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" && "${GITHUB_REF_NAME}" != "ops/owner-approved-delete-docs-a2-20261105" ]]; then
            echo "::error::Unexpected trigger branch."
            exit 1
          fi

      - name: Delete the exact approved branch ref
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event_name == 'push' && 'integration/documents-file-management-a2-2026-11-05' || inputs.branch_name }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
          echo "Deleted branch: ${BRANCH}"
