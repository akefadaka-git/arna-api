name: ARNA Symfony security dependency remediation (PR branch)

on:
  push:
    branches:
      - integration/a3-api-release-preparation-2026-11-25-r2
    paths:
      - ".github/workflows/arna-symfony-security-remediation-pr.yml"

permissions:
  contents: write

concurrency:
  group: arna-symfony-security-remediation-pr
  cancel-in-progress: false

jobs:
  resolve-patched-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Verify source branch and SHA
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "integration/a3-api-release-preparation-2026-11-25-r2"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Resolver source SHA: $(git rev-parse HEAD)"

      - name: Set up PHP 8.3 and Composer 2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, mbstring, pdo_mysql, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install current locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Resolve patched Symfony 7.4 dependencies
        run: |
          composer update symfony/http-kernel symfony/http-foundation symfony/mailer symfony/routing --with-all-dependencies --no-interaction --no-progress

      - name: Validate lock, enforce patched 7.4 versions, and audit
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          php -r '
          $lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR);
          $required = ["symfony/http-kernel", "symfony/http-foundation", "symfony/mailer", "symfony/routing"];
          $packages = [];
          foreach (array_merge($lock["packages"] ?? [], $lock["packages-dev"] ?? []) as $package) {
              $packages[$package["name"]] = $package["version"];
          }
          foreach ($required as $name) {
              $version = $packages[$name] ?? null;
              if (!$version || !preg_match("/^v?7\\.4\\./", $version) || version_compare(ltrim($version, "v"), "7.4.24", "<")) {
                  fwrite(STDERR, "Unpatched or incompatible $name version: " . ($version ?? "MISSING") . PHP_EOL);
                  exit(1);
              }
              echo "$name $version" . PHP_EOL;
          }
          ' | tee symfony-security-patched-versions.txt
          composer audit --format=plain

      - name: Commit only the resolved Composer lockfile to the PR branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git diff --quiet -- composer.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git diff --cached --name-only | grep -Fx "composer.lock"
            test "$(git diff --cached --name-only | wc -l)" -eq 1
            git commit -m "fix(deps): patch Symfony security advisories"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No Composer lockfile changes were needed."
          fi

      - name: Upload resolver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arna-symfony-security-lock-resolution-${{ github.run_id }}
          path: |
            composer.lock
            symfony-security-patched-versions.txt
          if-no-files-found: warn
          retention-days: 7
