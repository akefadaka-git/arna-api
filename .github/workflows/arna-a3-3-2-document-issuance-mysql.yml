name: ARNA A3.3.2 exact-SHA document issuance MySQL verification

on:
  push:
    branches:
      - 'integration/**'
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/arna-a3-3-2-document-issuance-mysql.yml"
      - "database/migrations/2026_11_18_00000*.php"
      - "database/migrations/2026_11_22_000001_create_document_evidence_capture_intents.php"
      - "mases_core/src/Domains/Documents/**"
      - "mases_core/src/Providers/CoreServiceProvider.php"
      - "tests/Feature/DocumentWorkflowAggregateServiceTest.php"
      - "routes/console.php"
      - "tests/Feature/DocumentWorkflowMySqlConcurrencyTest.php"
      - "tests/Unit/Documents/ImmutableDocumentBinaryStoreSecurityTest.php"
      - "tests/Unit/Documents/DocumentSignatureTimestampValidationTest.php"
      - "mases_core/src/Domains/Governance/Tests/Feature/GovernanceAuthorityGrantTest.php"
      - "docs/documents/**"

permissions:
  contents: read

concurrency:
  group: arna-a3-3-2-documents-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  document-issuance:
    name: Exact-SHA MySQL migrations, issuance and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arna_document_a3_3_2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: arna_document_a3_3_2_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Check out exact pull-request head or pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact source SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Expected: ${EXPECTED_SHA}"
          echo "Actual:   ${actual}"
          test "${actual}" = "${EXPECTED_SHA}"

      - name: Create runner-local environment file
        run: touch .env

      - name: Set up PHP 8.3 with MySQL and Sodium
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, pcntl, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, mysqli, openssl, pcre, pdo_mysql, session, sodium, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint changed document PHP files
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.php' | xargs -0 -n1 php -l

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Run all migrations on fresh disposable MySQL
        run: php artisan migrate --force -vvv

      - name: Verify evidence reconciliation command is registered and dry-run safe
        run: |
          php artisan list --raw | grep -F "arna:documents:reconcile-evidence-captures"
          php artisan arna:documents:reconcile-evidence-captures --limit=100 --grace-minutes=1440

      - name: Run A3.3.2 aggregate, signature, immutable evidence and rollback tests on MySQL
        run: php artisan test --compact tests/Feature/DocumentWorkflowAggregateServiceTest.php

      - name: Run immutable evidence storage path and permission security tests
        run: php artisan test --compact tests/Unit/Documents/ImmutableDocumentBinaryStoreSecurityTest.php

      - name: Run strict document signature timestamp tests
        run: php artisan test --compact tests/Unit/Documents/DocumentSignatureTimestampValidationTest.php

      - name: Run two-session atomic issuance concurrency test on MySQL
        env:
          ARNA_RUN_MYSQL_CONCURRENCY: "1"
        run: php artisan test --compact tests/Feature/DocumentWorkflowMySqlConcurrencyTest.php
