name: Isolated API Composer dependency audit

on:
  push:
    branches:
      - audit/arna-repository-consolidation-2026-11-04
    paths:
      - .github/workflows/dependency-audit.yml

permissions:
  contents: read

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up PHP 8.3 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, openssl, pcre, pdo_sqlite, session, sqlite3, tokenizer, xml, zip
          tools: composer:v2
          coverage: none
      - name: Validate and install locked dependencies
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress
      - name: Report Composer security advisories
        shell: bash
        run: |
          composer audit --format=json > "$RUNNER_TEMP/composer-audit.json" || true
          php -r '
            $report = json_decode(file_get_contents(getenv("RUNNER_TEMP") . "/composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            echo "Advisory summary: " . json_encode($report["advisories"] ?? [], JSON_UNESCAPED_SLASHES) . PHP_EOL;
          '
      - name: Upload Composer audit report
        uses: actions/upload-artifact@v4
        with:
          name: arna-api-composer-audit
          path: ${{ runner.temp }}/composer-audit.json
          if-no-files-found: error
