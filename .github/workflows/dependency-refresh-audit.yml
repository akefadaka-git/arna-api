name: Isolated API dependency security refresh

on:
  push:
    branches:
      - audit/arna-repository-consolidation-2026-11-04
    paths:
      - .github/workflows/dependency-refresh-audit.yml

permissions:
  contents: read

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up PHP 8.3 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, openssl, pcre, pdo_sqlite, session, sqlite3, tokenizer, xml, zip
          tools: composer:v2
          coverage: none
      - name: Update only packages with confirmed advisories
        run: composer update league/commonmark symfony/mime --with-dependencies --no-interaction --no-progress
      - name: Validate candidate lock and report remaining advisories
        shell: bash
        run: |
          composer validate --no-check-publish
          composer audit --format=json > "$RUNNER_TEMP/composer-audit-after.json" || true
          php -r '
            $report = json_decode(file_get_contents(getenv("RUNNER_TEMP") . "/composer-audit-after.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($report["advisories"] ?? []) as $package => $items) {
                foreach ($items as $item) {
                    echo json_encode(["package" => $package, "severity" => $item["severity"] ?? null, "title" => $item["title"] ?? null, "affected" => $item["affectedVersions"] ?? null], JSON_UNESCAPED_SLASHES) . PHP_EOL;
                }
            }
          '
      - name: Run canonical localization regression
        run: php artisan test --compact tests/Unit/LocalizationServiceTest.php
      - name: Upload candidate Composer lock and advisory report
        uses: actions/upload-artifact@v4
        with:
          name: arna-api-dependency-refresh-candidate
          path: |
            composer.lock
            ${{ runner.temp }}/composer-audit-after.json
          if-no-files-found: error
