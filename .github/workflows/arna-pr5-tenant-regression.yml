name: ARNA authentication, tenant membership, and authorization regression

on:
  push:
    branches:
      - integration/arna-system-consolidation
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Commit SHA or branch to test (manual runs default to the reviewed PR #5 commit)"
        required: true
        type: string
        default: "9d27cce14fd1d996a9e8746ade15daad0bad3fdc"

permissions:
  contents: read

concurrency:
  group: arna-auth-tenant-authorization-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    name: PHP 8.3 authentication, tenant, and authorization regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.sha }}
          persist-credentials: false

      - name: Verify checked-out revision
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.target_ref || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Requested ref: ${REQUESTED_REF}"
          echo "Checked-out commit: ${actual_sha}"
          if [[ "${REQUESTED_REF}" =~ ^[0-9a-fA-F]{40}$ ]] && [[ "${actual_sha}" != "${REQUESTED_REF}" ]]; then
            echo "::error::Checked-out commit does not match requested SHA."
            exit 1
          fi

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, openssl, pcre, pdo_sqlite, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run authentication lifecycle regression
        run: vendor/bin/phpunit tests/Feature/AuthenticationLifecycleTest.php

      - name: Run login throttling regression
        run: vendor/bin/phpunit tests/Feature/LoginThrottlingTest.php

      - name: Run authorization failure event regression
        run: vendor/bin/phpunit tests/Feature/AuthorizationFailureEventTest.php

      - name: Run RBAC authorization regression
        run: vendor/bin/phpunit tests/Feature/RbacAuthorizationTest.php

      - name: Run tenant resolution regression
        run: vendor/bin/phpunit tests/Feature/C09/TenantResolutionTest.php

      - name: Run tenant membership lifecycle regression
        run: vendor/bin/phpunit tests/Feature/TenantMembershipLifecycleTest.php

      - name: Run tenant membership regression
        run: vendor/bin/phpunit tests/Feature/TenantMembershipTest.php

      - name: Run tenant isolation regression
        run: vendor/bin/phpunit tests/Feature/TenantIsolationTest.php

      - name: Run tenant-required route regression
        run: vendor/bin/phpunit tests/Feature/TenantRequiredRouteTest.php

      - name: Run tenant-scoped permission regression
        run: vendor/bin/phpunit tests/Unit/UserPermissionScopeTest.php

      - name: Run tenant resolver unit regression
        run: vendor/bin/phpunit tests/Unit/TenantResolverTest.php
