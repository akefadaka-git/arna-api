name: ARNA Composer security exact-head verification

on:
  push:
    branches:
      - feat/ga-statutory-controls-a3-current-main
    paths:
      - ".github/workflows/arna-composer-security-exact-head.yml"
      - "composer.json"
      - "composer.lock"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/arna-composer-security-exact-head.yml"
      - "composer.json"
      - "composer.lock"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character commit SHA to audit"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arna-composer-security-${{ github.event.pull_request.head.sha || inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  composer-security:
    name: Composer audit on exact candidate SHA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve exact target SHA
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_SHA: ${{ inputs.target_sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            expected="${INPUT_SHA}"
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            expected="${PR_SHA}"
          else
            expected="${PUSH_SHA}"
          fi
          [[ "${expected}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "expected_sha=${expected,,}" >> "$GITHUB_OUTPUT"

      - name: Check out exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.expected_sha }}
          persist-credentials: false

      - name: Assert checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${actual}"
          test "${actual}" = "${EXPECTED_SHA}"

      - name: Set up PHP 8.3 and Composer 2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Enforce locked dependency security audit
        run: composer audit --format=plain

      - name: Record exact-head audit evidence
        if: always()
        shell: bash
        run: |
          {
            echo "expected_sha=${{ steps.target.outputs.expected_sha }}"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "composer_version=$(composer --version --no-ansi 2>/dev/null || echo unavailable)"
            echo "audit_exit_status=${{ job.status }}"
          } > composer-security-exact-head.txt

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arna-composer-security-${{ github.run_id }}
          path: composer-security-exact-head.txt
          retention-days: 14
