name: ARNA shareholder import preview and review persistence tests

on:
  push:
    branches: [main]
    paths:
      - "mases_core/src/Domains/Shareholder/Services/ShareholderImportPreviewValidator.php"
      - "mases_core/src/Domains/Shareholder/Services/ShareholderCsvPreviewService.php"
      - "mases_core/src/Domains/Shareholder/Services/ShareholderImportReviewPolicy.php"
      - "mases_core/src/Domains/Shareholder/Services/ShareholderImportReviewService.php"
      - "mases_core/src/Domains/Shareholder/Models/ShareholderImportSubmission.php"
      - "mases_core/src/Domains/Shareholder/Models/ShareholderImportDecision.php"
      - "mases_core/src/Domains/Shareholder/Tests/Unit/ShareholderImportPreviewServiceTest.php"
      - "mases_core/src/Domains/Shareholder/Tests/Unit/ShareholderImportReviewPolicyTest.php"
      - "tests/Feature/ShareholderImportReviewPersistenceTest.php"
      - "database/migrations/2026_11_25_000004_create_shareholder_import_review_tables.php"
      - "database/seeders/Data/PermissionCatalogue.php"
      - "docs/architecture/shareholder-import-review-approval-boundary.md"
      - ".github/workflows/arna-shareholder-import-preview.yml"
      - "composer.json"
      - "composer.lock"
  pull_request:
    branches: [main]
    paths:
      - "mases_core/src/Domains/Shareholder/Services/ShareholderImportPreviewValidator.php"
      - "mases_core/src/Domains/Shareholder/Services/ShareholderCsvPreviewService.php"
      - "mases_core/src/Domains/Shareholder/Services/ShareholderImportReviewPolicy.php"
      - "mases_core/src/Domains/Shareholder/Services/ShareholderImportReviewService.php"
      - "mases_core/src/Domains/Shareholder/Models/ShareholderImportSubmission.php"
      - "mases_core/src/Domains/Shareholder/Models/ShareholderImportDecision.php"
      - "mases_core/src/Domains/Shareholder/Tests/Unit/ShareholderImportPreviewServiceTest.php"
      - "mases_core/src/Domains/Shareholder/Tests/Unit/ShareholderImportReviewPolicyTest.php"
      - "tests/Feature/ShareholderImportReviewPersistenceTest.php"
      - "database/migrations/2026_11_25_000004_create_shareholder_import_review_tables.php"
      - "database/seeders/Data/PermissionCatalogue.php"
      - "docs/architecture/shareholder-import-review-approval-boundary.md"
      - ".github/workflows/arna-shareholder-import-preview.yml"
      - "composer.json"
      - "composer.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-tests:
    name: Shareholder import preview and review persistence (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, mbstring, pdo_sqlite, sqlite3, xml, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint import preview and review source/tests
        run: |
          php -l mases_core/src/Domains/Shareholder/Services/ShareholderImportPreviewValidator.php
          php -l mases_core/src/Domains/Shareholder/Services/ShareholderCsvPreviewService.php
          php -l mases_core/src/Domains/Shareholder/Services/ShareholderImportReviewPolicy.php
          php -l mases_core/src/Domains/Shareholder/Services/ShareholderImportReviewService.php
          php -l mases_core/src/Domains/Shareholder/Models/ShareholderImportSubmission.php
          php -l mases_core/src/Domains/Shareholder/Models/ShareholderImportDecision.php
          php -l database/migrations/2026_11_25_000004_create_shareholder_import_review_tables.php
          php -l tests/Feature/ShareholderImportReviewPersistenceTest.php
          php -l mases_core/src/Domains/Shareholder/Tests/Unit/ShareholderImportPreviewServiceTest.php
          php -l mases_core/src/Domains/Shareholder/Tests/Unit/ShareholderImportReviewPolicyTest.php

      - name: Run shareholder import preview, policy and persistence tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "true"
        run: |
          php artisan test --compact mases_core/src/Domains/Shareholder/Tests/Unit/ShareholderImportPreviewServiceTest.php
          php artisan test --compact mases_core/src/Domains/Shareholder/Tests/Unit/ShareholderImportReviewPolicyTest.php
          php artisan test --compact tests/Feature/ShareholderImportReviewPersistenceTest.php
