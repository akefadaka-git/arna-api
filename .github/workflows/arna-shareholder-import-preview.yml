name: ARNA shareholder import preview and review persistence tests

# A4 verification: this workflow file is a push-path trigger so the dedicated
# MySQL gate can be re-run on an exact main commit without touching application data.

on:
  push:
    branches: [main]
    paths:
      - "arna_core/src/Domains/Shareholder/Services/ShareholderImportPreviewValidator.php"
      - "arna_core/src/Domains/Shareholder/Services/ShareholderCsvPreviewService.php"
      - "arna_core/src/Domains/Shareholder/Services/ShareholderImportReviewPolicy.php"
      - "arna_core/src/Domains/Shareholder/Services/ShareholderImportReviewService.php"
      - "arna_core/src/Domains/Shareholder/Models/ShareholderImportSubmission.php"
      - "arna_core/src/Domains/Shareholder/Models/ShareholderImportDecision.php"
      - "arna_core/src/Domains/Shareholder/Tests/Unit/ShareholderImportPreviewServiceTest.php"
      - "arna_core/src/Domains/Shareholder/Tests/Unit/ShareholderImportReviewPolicyTest.php"
      - "tests/Feature/ShareholderImportReviewPersistenceTest.php"
      - "database/migrations/2026_11_25_000004_create_shareholder_import_review_tables.php"
      - "database/seeders/Data/PermissionCatalogue.php"
      - "docs/architecture/shareholder-import-review-approval-boundary.md"
      - ".github/workflows/arna-shareholder-import-preview.yml"
      - "composer.json"
      - "composer.lock"
  pull_request:
    branches: [main]
    paths:
      - "arna_core/src/Domains/Shareholder/Services/ShareholderImportPreviewValidator.php"
      - "arna_core/src/Domains/Shareholder/Services/ShareholderCsvPreviewService.php"
      - "arna_core/src/Domains/Shareholder/Services/ShareholderImportReviewPolicy.php"
      - "arna_core/src/Domains/Shareholder/Services/ShareholderImportReviewService.php"
      - "arna_core/src/Domains/Shareholder/Models/ShareholderImportSubmission.php"
      - "arna_core/src/Domains/Shareholder/Models/ShareholderImportDecision.php"
      - "arna_core/src/Domains/Shareholder/Tests/Unit/ShareholderImportPreviewServiceTest.php"
      - "arna_core/src/Domains/Shareholder/Tests/Unit/ShareholderImportReviewPolicyTest.php"
      - "tests/Feature/ShareholderImportReviewPersistenceTest.php"
      - "database/migrations/2026_11_25_000004_create_shareholder_import_review_tables.php"
      - "database/seeders/Data/PermissionCatalogue.php"
      - "docs/architecture/shareholder-import-review-approval-boundary.md"
      - ".github/workflows/arna-shareholder-import-preview.yml"
      - "composer.json"
      - "composer.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-tests:
    name: Shareholder import preview and review persistence (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arna_shareholder_review_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify exact checked-out source SHA
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Verified source SHA: $(git rev-parse HEAD)"

      - name: Create runner-local environment file for Laravel tests
        run: touch .env

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, mbstring, pdo_mysql, xml, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint import preview and review source/tests
        run: |
          php -l arna_core/src/Domains/Shareholder/Services/ShareholderImportPreviewValidator.php
          php -l arna_core/src/Domains/Shareholder/Services/ShareholderCsvPreviewService.php
          php -l arna_core/src/Domains/Shareholder/Services/ShareholderImportReviewPolicy.php
          php -l arna_core/src/Domains/Shareholder/Services/ShareholderImportReviewService.php
          php -l arna_core/src/Domains/Shareholder/Models/ShareholderImportSubmission.php
          php -l arna_core/src/Domains/Shareholder/Models/ShareholderImportDecision.php
          php -l database/migrations/2026_11_25_000004_create_shareholder_import_review_tables.php
          php -l tests/Feature/ShareholderImportReviewPersistenceTest.php
          php -l arna_core/src/Domains/Shareholder/Tests/Unit/ShareholderImportPreviewServiceTest.php
          php -l arna_core/src/Domains/Shareholder/Tests/Unit/ShareholderImportReviewPolicyTest.php

      - name: Run shareholder import preview, policy and persistence tests
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: arna_shareholder_review_test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan test --compact arna_core/src/Domains/Shareholder/Tests/Unit/ShareholderImportPreviewServiceTest.php
          php artisan test --compact arna_core/src/Domains/Shareholder/Tests/Unit/ShareholderImportReviewPolicyTest.php
          php artisan test --compact tests/Feature/ShareholderImportReviewPersistenceTest.php
