name: PR 49 safe base-branch synchronization

on:
  push:
    branches:
      - fix/organization-domain-production-gaps

permissions:
  pull-requests: write

concurrency:
  group: pr-49-base-sync
  cancel-in-progress: false

jobs:
  update-pr-branch:
    if: github.event.head_commit.message == 'chore(ci): trigger safe PR #49 base sync'
    runs-on: ubuntu-latest
    steps:
      - name: Merge current main into PR #49 head using expected SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/49/update-branch" \
            -f "expected_head_sha=${EXPECTED_HEAD_SHA}"
