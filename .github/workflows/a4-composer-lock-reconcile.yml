name: A4 one-time Composer lock reconciliation

on:
  push:
    branches:
      - a3/arna-core-identity-migration

permissions:
  contents: write

jobs:
  reconcile-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3/arna-core-identity-migration
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Refresh lock metadata without changing dependency versions
        run: composer update --lock --no-install --no-scripts --no-interaction
      - name: Validate and commit lock metadata
        run: |
          composer validate --no-check-publish
          if ! git diff --quiet -- composer.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git commit -m "fix(deps): reconcile Composer lock metadata"
            git push origin HEAD:a3/arna-core-identity-migration
          else
            echo "Composer lock already matches composer.json."
          fi
