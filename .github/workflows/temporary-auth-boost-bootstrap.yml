name: Temporary Laravel Boost guideline bootstrap

on:
  push:
    branches:
      - chore/auth-boost-guideline-bootstrap

permissions:
  contents: read

concurrency:
  group: arna-auth-boost-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Install Boost and print generated repository guidance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up PHP 8.3 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - name: Verify prerequisites
        run: |
          php -v
          composer -V
      - name: Install locked project dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Install Laravel Boost in the ephemeral runner
        run: composer require laravel/boost --dev --no-interaction --no-progress
      - name: Generate and display repository-specific agent guidance
        env:
          APP_ENV: local
          APP_DEBUG: "true"
        run: |
          php artisan boost:install --no-interaction
          test -s AGENTS.md
          echo "===== GENERATED AGENTS.md ====="
          cat AGENTS.md
