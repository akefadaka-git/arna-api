name: ARNA centralized error diagnostics contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/central-error-diagnostics.yml"
      - "bootstrap/app.php"
      - "mases_core/src/Exceptions/ErrorCodeRegistry.php"
      - "mases_core/src/Monitoring/ErrorDiagnosticEngine.php"
      - "tests/Unit/ErrorDiagnosticEngineTest.php"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character commit SHA to test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arna-error-diagnostics-${{ github.event.pull_request.number || inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  error-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Resolve exact target commit
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.target_sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            expected_sha="${INPUT_SHA}"
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            expected_sha="${PR_SHA}"
          else
            expected_sha="${TRIGGER_SHA}"
          fi
          [[ "${expected_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "expected_sha=${expected_sha,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.expected_sha }}
          persist-credentials: false

      - name: Verify exact commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_SHA}"
          echo "Verified exact SHA: ${actual_sha}"

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, pdo_sqlite, sqlite3, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run centralized error diagnostics unit tests
        run: php artisan test --compact tests/Unit/ErrorDiagnosticEngineTest.php

      - name: Check formatting of changed PHP files
        run: vendor/bin/pint --test bootstrap/app.php mases_core/src/Exceptions/ErrorCodeRegistry.php mases_core/src/Monitoring/ErrorDiagnosticEngine.php tests/Unit/ErrorDiagnosticEngineTest.php
