name: ARNA Documents numbering exact-SHA verification

on:
  push:
    branches:
      - feat/a3-2-document-registry-numbering
    paths:
      - ".github/workflows/arna-documents-numbering-a4.yml"
      - "database/migrations/**"
      - "mases_core/src/Domains/Documents/**"
      - "tests/Unit/Documents/**"
      - "docs/architecture/documents-registry-taxonomy-numbering-a3-2.md"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character commit SHA to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arna-documents-numbering-${{ github.event.inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  exact-sha-mysql:
    name: Exact-SHA MySQL schema and allocator verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arna_documents_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: arna_documents_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Resolve exact target SHA
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.target_sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            expected_sha="${INPUT_SHA}"
          else
            expected_sha="${PUSH_SHA}"
          fi
          [[ "${expected_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "expected_sha=${expected_sha,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.expected_sha }}
          persist-credentials: false

      - name: Verify checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "${EXPECTED_SHA}" "${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, iconv, json, mbstring, mysqli, openssl, pcntl, pdo_mysql, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Lint changed Documents PHP sources and tests
        run: |
          php -l database/migrations/2026_11_18_000001_create_documents_registry_and_numbering_tables.php
          find mases_core/src/Domains/Documents tests/Unit/Documents -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate and install locked Composer dependencies
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress

      - name: Apply and verify Pint formatting for A3.2 files
        run: |
          vendor/bin/pint database/migrations/2026_11_18_000001_create_documents_registry_and_numbering_tables.php mases_core/src/Domains/Documents/Services/DocumentNumberAllocator.php mases_core/src/Domains/Documents/Services/DocumentNumberFormatter.php tests/Unit/Documents/DocumentNumberAllocatorTest.php tests/Unit/Documents/DocumentNumberAllocatorTransactionGuardTest.php tests/Unit/Documents/DocumentNumberingContractTest.php tests/Unit/Documents/DocumentNumberingSchemaTest.php
          vendor/bin/pint --test database/migrations/2026_11_18_000001_create_documents_registry_and_numbering_tables.php mases_core/src/Domains/Documents/Services/DocumentNumberAllocator.php mases_core/src/Domains/Documents/Services/DocumentNumberFormatter.php tests/Unit/Documents/DocumentNumberAllocatorTest.php tests/Unit/Documents/DocumentNumberAllocatorTransactionGuardTest.php tests/Unit/Documents/DocumentNumberingContractTest.php tests/Unit/Documents/DocumentNumberingSchemaTest.php
          mkdir -p pint-output
          cp database/migrations/2026_11_18_000001_create_documents_registry_and_numbering_tables.php pint-output/
          cp mases_core/src/Domains/Documents/Services/DocumentNumberAllocator.php pint-output/
          cp mases_core/src/Domains/Documents/Services/DocumentNumberFormatter.php pint-output/
          cp tests/Unit/Documents/DocumentNumberAllocatorTest.php pint-output/
          cp tests/Unit/Documents/DocumentNumberAllocatorTransactionGuardTest.php pint-output/
          cp tests/Unit/Documents/DocumentNumberingContractTest.php pint-output/
          cp tests/Unit/Documents/DocumentNumberingSchemaTest.php pint-output/

      - name: Run all migrations on clean MySQL
        run: php artisan migrate:fresh --force -vvv

      - name: Assert canonical tables and database constraints
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot arna_documents_test -e "
            SELECT TABLE_NAME FROM information_schema.TABLES
            WHERE TABLE_SCHEMA='arna_documents_test'
              AND TABLE_NAME IN (
                'document_type_catalogue',
                'document_entity_code_assignments',
                'document_department_code_assignments',
                'document_number_counters',
                'documents',
                'document_lifecycle_events'
              );
          "
          test "$(mysql -N -h 127.0.0.1 -uroot -proot arna_documents_test -e "SELECT COUNT(*) FROM document_type_catalogue")" -eq 15
          test "$(mysql -N -h 127.0.0.1 -uroot -proot arna_documents_test -e "SELECT COUNT(*) FROM information_schema.KEY_COLUMN_USAGE WHERE TABLE_SCHEMA='arna_documents_test' AND TABLE_NAME IN ('document_number_counters','documents') AND REFERENCED_TABLE_NAME IS NOT NULL")" -ge 6
          echo "15 document types and tenant/entity/department/type/file foreign keys verified."

      - name: Run Documents numbering unit and database tests on MySQL
        run: php artisan test --compact tests/Unit/Documents

      - name: Confirm migration rerun is stable
        run: php artisan migrate --force -vvv

      - name: Record exact-SHA verification evidence
        if: always()
        shell: bash
        run: |
          {
            echo "Expected SHA: ${{ steps.target.outputs.expected_sha }}"
            echo "Actual SHA: $(git rev-parse HEAD)"
            php --version
            mysql --version
            php artisan migrate:status
          } > documents-numbering-a4-evidence.txt

      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arna-documents-numbering-a4-${{ github.run_id }}
          path: documents-numbering-a4-evidence.txt
          if-no-files-found: warn
          retention-days: 14
