name: A5 production environment preflight

on:
  pull_request:
    branches: [ "feat/executive-overview-a3" ]
    paths:
      - ".env.production.example"
      - "config/cors.php"
      - "docs/operations/A5-PRODUCTION-ENVIRONMENT-BASELINE.md"
      - "docs/operations/A5-ETHIOTELECOM-PLESK-DEPLOYMENT-CHECKLIST.md"
      - "scripts/production-env-preflight.php"
      - "scripts/a5-php-runtime-diagnostic.php"
      - ".github/workflows/a5-production-preflight.yml"
  push:
    branches: [ "hardening/**" ]
    paths:
      - ".env.production.example"
      - "config/cors.php"
      - "docs/operations/A5-PRODUCTION-ENVIRONMENT-BASELINE.md"
      - "docs/operations/A5-ETHIOTELECOM-PLESK-DEPLOYMENT-CHECKLIST.md"
      - "scripts/production-env-preflight.php"
      - "scripts/a5-php-runtime-diagnostic.php"
      - ".github/workflows/a5-production-preflight.yml"

permissions:
  contents: read

concurrency:
  group: a5-api-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Lint preflight scripts
        run: |
          php -l scripts/production-env-preflight.php
          php -l scripts/a5-php-runtime-diagnostic.php
      - name: Verify PHP runtime diagnostic output
        run: |
          php scripts/a5-php-runtime-diagnostic.php > "${RUNNER_TEMP}/a5-runtime.json"
          php -r '$d=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); if (($d["php_version"] ?? "") === "" || ($d["sapi"] ?? "") !== "cli" || !array_key_exists("curl", $d["required_extensions"] ?? [])) { fwrite(STDERR, "Runtime diagnostic output invalid.\n"); exit(1); } echo "Runtime diagnostic structure: PASS\n";' "${RUNNER_TEMP}/a5-runtime.json"
      - name: Confirm template fails closed
        run: |
          if php scripts/production-env-preflight.php .env.production.example; then
            echo "Template unexpectedly passed preflight."
            exit 1
          fi
      - name: Validate a synthetic production environment
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/arna-production-test.env" <<'EOF'
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=https://api.maalearna.com.et
          APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION=mysql
          DB_HOST=db.example.test
          DB_DATABASE=arna_test
          DB_USERNAME=arna_app
          DB_PASSWORD=synthetic-only-password
          MAIL_HOST=mail.example.test
          MAIL_USERNAME=synthetic-user
          MAIL_PASSWORD=synthetic-password
          MAIL_FROM_ADDRESS=notifications@example.test
          SESSION_ENCRYPT=true
          SESSION_SECURE_COOKIE=true
          SESSION_HTTP_ONLY=true
          SESSION_SAME_SITE=lax
          SESSION_DOMAIN=.maalearna.com.et
          SANCTUM_STATEFUL_DOMAINS=app.maalearna.com.et,portal.maalearna.com.et,admin.maalearna.com.et
          CORS_ALLOWED_ORIGINS=https://app.maalearna.com.et,https://portal.maalearna.com.et,https://admin.maalearna.com.et
          EOF
          php scripts/production-env-preflight.php "${RUNNER_TEMP}/arna-production-test.env"
          sed 's#APP_URL=https://api.maalearna.com.et#APP_URL=https://api.attacker.example#' "${RUNNER_TEMP}/arna-production-test.env" > "${RUNNER_TEMP}/arna-production-wrong-origin.env"
          if php scripts/production-env-preflight.php "${RUNNER_TEMP}/arna-production-wrong-origin.env"; then
            echo "Unexpected API origin passed production preflight."
            exit 1
          fi
          echo "Wrong production API origin rejected: PASS"
          sed 's#CORS_ALLOWED_ORIGINS=https://app.maalearna.com.et,https://portal.maalearna.com.et,https://admin.maalearna.com.et#CORS_ALLOWED_ORIGINS=http://localhost:5173,https://portal.maalearna.com.et,https://admin.maalearna.com.et#' "${RUNNER_TEMP}/arna-production-test.env" > "${RUNNER_TEMP}/arna-production-localhost-cors.env"
          if php scripts/production-env-preflight.php "${RUNNER_TEMP}/arna-production-localhost-cors.env"; then
            echo "Unexpected localhost production CORS origin passed preflight."
            exit 1
          fi
          echo "Unapproved localhost production CORS origin rejected: PASS"
