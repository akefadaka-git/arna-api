name: ARNA P0.9 seeded credential security

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/arna-p0-9-bootstrap-credential-security.yml"
      - "database/seeders/**"
      - "database/seeders/Support/BootstrapCredentialProvisioner.php"
      - "routes/console.php"
      - "tests/Unit/BootstrapCredentialProvisionerTest.php"
      - "tests/Feature/BootstrapCredentialRotationCommandTest.php"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character commit SHA to test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arna-p0-9-credential-security-${{ github.event.pull_request.number || inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  credential-security:
    name: Exact-head credential provisioning and rotation tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      DB_FOREIGN_KEYS: "true"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: null
    steps:
      - name: Check out exact proposed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact target SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.target_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Verified exact tested SHA: $EXPECTED_SHA"

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, openssl, pcre, pdo_sqlite, session, sqlite3, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest and install locked dependencies
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress

      - name: Create isolated environment and clear cached configuration
        run: |
          : > .env
          php artisan config:clear
          php artisan route:clear

      - name: Lint P0.9 PHP files
        run: |
          php -l database/seeders/AdminUserSeeder.php
          php -l database/seeders/ShareholderSeeder.php
          php -l database/seeders/Data/BootstrapUsers.php
          php -l database/seeders/MasesCoreSeeder.php
          php -l database/seeders/Support/BootstrapCredentialProvisioner.php
          php -l routes/console.php
          php -l tests/Unit/BootstrapCredentialProvisionerTest.php
          php -l tests/Feature/BootstrapCredentialRotationCommandTest.php

      - name: Verify credential rotation command registration
        run: php artisan list --raw | grep -F "arna:rotate-compromised-bootstrap-credentials"

      - name: Test per-account credential generation and reseed preservation
        run: php artisan test --filter=BootstrapCredentialProvisionerTest

      - name: Test dry-run, password rotation, remember-token invalidation and API-token revocation
        run: php artisan test --filter=BootstrapCredentialRotationCommandTest
