name: ARNA Governance authorization regression

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/arna-governance-body-regression.yml"
      - "mases_core/src/Domains/Governance/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/arna-governance-body-regression.yml"
      - "mases_core/src/Domains/Governance/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact commit SHA to test (defaults to the workflow-triggering SHA)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: arna-governance-body-regression-${{ github.event.pull_request.number || inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  governance-body-regression:
    name: PHP lint and Governance authorization feature tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve expected commit
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_SHA: ${{ inputs.target_sha }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            expected_sha="${PR_HEAD_SHA}"
          elif [[ -n "${INPUT_SHA}" ]]; then
            expected_sha="${INPUT_SHA}"
          else
            expected_sha="${TRIGGER_SHA}"
          fi
          if [[ ! "${expected_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Expected a full 40-character commit SHA; received: ${expected_sha}" >&2
            exit 1
          fi
          echo "expected_sha=${expected_sha,,}" >> "${GITHUB_OUTPUT}"

      - name: Check out exact target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.expected_sha }}
          persist-credentials: false

      - name: Verify exact checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Expected commit: ${EXPECTED_SHA}"
          echo "Checked-out commit: ${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, openssl, pcre, pdo_sqlite, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: PHP syntax lint
        run: |
          set -euo pipefail
          php -l mases_core/src/Domains/Governance/Http/Requests/StoreGovernanceBodyRequest.php
          php -l mases_core/src/Domains/Governance/Http/Requests/UpdateGovernanceBodyRequest.php
          php -l mases_core/src/Domains/Governance/Http/Requests/StoreGovernancePositionRequest.php
          php -l mases_core/src/Domains/Governance/Http/Requests/UpdateGovernancePositionRequest.php
          php -l mases_core/src/Domains/Governance/Http/Requests/StoreGovernanceTermRequest.php
          php -l mases_core/src/Domains/Governance/Http/Requests/UpdateGovernanceTermRequest.php
          php -l mases_core/src/Domains/Governance/Tests/Feature/GovernanceBodyTest.php
          php -l mases_core/src/Domains/Governance/Tests/Feature/GovernancePositionTest.php
          php -l mases_core/src/Domains/Governance/Tests/Feature/GovernanceTermTest.php
          php -l mases_core/src/Domains/Governance/Tests/Feature/GovernanceAppointmentTest.php
          php -l mases_core/src/Domains/Governance/Tests/Feature/GovernanceMembershipTest.php
          php -l mases_core/src/Domains/Governance/Models/GovernanceAuthorityGrant.php
          php -l mases_core/src/Domains/Governance/Services/GovernanceAuthorityGrantService.php
          php -l mases_core/src/Domains/Governance/Database/Migrations/2026_10_27_120000_create_governance_authority_grants_table.php
          php -l mases_core/src/Domains/Governance/Tests/Feature/GovernanceAuthorityGrantTest.php
          php -l mases_core/src/Domains/Governance/Http/Controllers/GovernanceAuthorityGrantController.php
          php -l mases_core/src/Domains/Governance/Routes/api.php
          php -l mases_core/src/Domains/Governance/Policies/GovernancePositionPolicy.php
          php -l mases_core/src/Domains/Governance/Policies/GovernanceAppointmentPolicy.php
          php -l mases_core/src/Domains/Governance/Policies/GovernanceMembershipPolicy.php
          php -l mases_core/src/Domains/Governance/Providers/GovernanceServiceProvider.php

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Governance authorization feature tests
        run: |
          set -euo pipefail
          vendor/bin/phpunit mases_core/src/Domains/Governance/Tests/Feature/GovernanceBodyTest.php
          vendor/bin/phpunit mases_core/src/Domains/Governance/Tests/Feature/GovernancePositionTest.php
          vendor/bin/phpunit mases_core/src/Domains/Governance/Tests/Feature/GovernanceTermTest.php
          vendor/bin/phpunit mases_core/src/Domains/Governance/Tests/Feature/GovernanceAppointmentTest.php
          vendor/bin/phpunit mases_core/src/Domains/Governance/Tests/Feature/GovernanceMembershipTest.php
          vendor/bin/phpunit mases_core/src/Domains/Governance/Tests/Feature/GovernanceAuthorityGrantTest.php
