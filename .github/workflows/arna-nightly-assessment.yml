name: ARNA Nightly Repository Assessment

on:
  schedule:
    # 00:00 Africa/Addis_Ababa (UTC+3) = 21:00 UTC on the previous day.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: arna-nightly-assessment
  cancel-in-progress: false

jobs:
  assess:
    name: Read-only repository assessment and daily report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out API repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate assessment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/arna_progress_assessment.py

      - name: Commit daily report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/progress/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "docs(progress): nightly ARNA repository assessment"
          git push origin HEAD:main
